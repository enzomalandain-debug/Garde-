<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Remplacements de garde</title>
<style>
/* Layout : tableau de garde — une barre de 24 h par jour en tête, puis le fil de travail : trous → messages → réponses → réglages. Une colonne, 760px max. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --sunk:#E4E9F1; --ink:#121C33; --muted:#566079; --line:#D3DAE5;
  --accent:#1D3A78; --on-accent:#FFFFFF;
  --gap:#C4282D; --on-gap:#FFFFFF; --gap-soft:#FBE4E3;
  --cover:#1D7553; --on-cover:#FFFFFF; --cover-soft:#DCF0E6;
  --dispo:#CAD6EC; --on-dispo:#22355E;
  --wait:#94570A; --wait-soft:#FBEFD8;
  --display:"Roboto Condensed","sans-serif-condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1220; --surface:#151D30; --sunk:#1D263B; --ink:#E6EBF4; --muted:#98A3B9; --line:#28324A;
    --accent:#9DB8F2; --on-accent:#0C1220;
    --gap:#F0646A; --on-gap:#22080A; --gap-soft:#3A1A1E;
    --cover:#4DC497; --on-cover:#06231A; --cover-soft:#15302A;
    --dispo:#2B3C62; --on-dispo:#CFDBF5;
    --wait:#F0B357; --wait-soft:#372A14;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#151D30; --sunk:#1D263B; --ink:#E6EBF4; --muted:#98A3B9; --line:#28324A;
  --accent:#9DB8F2; --on-accent:#0C1220;
  --gap:#F0646A; --on-gap:#22080A; --gap-soft:#3A1A1E;
  --cover:#4DC497; --on-cover:#06231A; --cover-soft:#15302A;
  --dispo:#2B3C62; --on-dispo:#CFDBF5;
  --wait:#F0B357; --wait-soft:#372A14;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px;display:flex;flex-direction:column;gap:18px}
body.has-tabs .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
#app{display:flex;flex-direction:column;gap:22px}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* En-tête */
.top{display:flex;flex-direction:column;gap:10px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(20px,5.6vw,28px)/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em}
.weekbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.weekbar select{flex:1 1 180px;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600}

/* Boutons et champs */
.btn{font:600 14px/1.1 var(--body);border-radius:8px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.small{padding:7px 11px;font-size:13px}
.btn.danger{color:var(--gap);border-color:var(--gap)}
.btn.ghost{background:transparent}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;min-width:0;max-width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label > input,label > select{color:var(--ink);font-size:15px}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font:700 21px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.sec h3{font:600 15px/1.2 var(--body);color:var(--muted);margin-top:6px}
.notice{background:var(--wait-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px}
.notice b{color:var(--wait)}
.tip{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* Résumé */
.summary{display:flex;flex-direction:column;gap:10px}
.sum-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font:700 58px/.9 var(--display);color:var(--gap)}
.big.ok{color:var(--cover)}
.big small{font-size:28px}
.sum-lbl{font:600 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.meter{display:flex;height:8px;border-radius:99px;background:var(--gap-soft);overflow:hidden}
.meter span{display:block;height:100%;background:var(--cover)}
.meter .m-prov{background:repeating-linear-gradient(135deg,var(--wait) 0 4px,transparent 4px 7px)}
.sum-meta{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}

/* Tableau de garde */
.board{display:flex;flex-direction:column;gap:6px;padding:14px 12px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:center}
.rlab{display:flex;align-items:baseline;gap:4px;line-height:1}
.rday{font:600 13px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.rnum{font:700 19px/1 var(--display)}
.rfer{color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
.rcode{font:600 10px/1 var(--body);border:1px solid var(--line);border-radius:4px;padding:2px 3px;color:var(--muted);margin-left:auto}
.bar{position:relative;display:flex;height:32px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.bar::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent calc(25% - .5px),var(--surface) calc(25% - .5px),var(--surface) calc(25% + .5px),transparent calc(25% + .5px),transparent calc(50% - .5px),var(--surface) calc(50% - .5px),var(--surface) calc(50% + .5px),transparent calc(50% + .5px),transparent calc(75% - .5px),var(--surface) calc(75% - .5px),var(--surface) calc(75% + .5px),transparent calc(75% + .5px));opacity:.55}
.seg{display:flex;align-items:center;justify-content:center;min-width:0;border:0;padding:0 2px;font:600 11px/1 var(--body);box-shadow:inset -1px 0 0 var(--surface)}
.seg i{font-style:normal;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;position:relative;z-index:1}
.s-hors{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px)}
.s-dispo{background:var(--dispo);color:var(--on-dispo)}
.s-trou{background:var(--gap);color:var(--on-gap);cursor:pointer}
.s-cover{background:var(--cover);color:var(--on-cover)}
button.s-cover{cursor:pointer}
.s-prov{background:var(--wait-soft);color:var(--wait);outline:1.5px dashed var(--wait);outline-offset:-2px;cursor:pointer}
.scale .ticks{position:relative;height:14px;font-size:11px;color:var(--muted)}
.scale .ticks span{position:absolute;transform:translateX(-50%)}
.scale .ticks span:first-child{transform:none}
.scale .ticks span:last-child{transform:translateX(-100%)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Listes */
.list{padding:0}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;padding:12px 14px;flex-wrap:wrap}
.item + .item{border-top:1px solid var(--line)}
.item-main{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 220px}
.slot{font-weight:600;font-size:16px}
.slot.trou{color:var(--gap)}
.item-sub{font-size:13px;color:var(--muted)}
.who{font-weight:600;font-size:16px}
.line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.assign{flex:1 1 100%;display:flex;flex-direction:column;gap:10px;background:var(--sunk);border-radius:10px;padding:12px}
.assign .hours{display:flex;gap:8px;flex-wrap:wrap}
.assign .hours label{flex:1 1 120px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.addrow{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line)}
.addrow input{flex:1 1 180px}

/* Pastilles */
.pill{display:inline-flex;align-items:center;font:600 12px/1 var(--body);padding:4px 8px;border-radius:99px;white-space:nowrap}
.p-attente{background:var(--wait-soft);color:var(--wait)}
.p-oui{background:var(--cover-soft);color:var(--cover)}
.p-peut{background:var(--dispo);color:var(--on-dispo)}
.p-non{background:var(--sunk);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.range{font:600 14px/1 var(--body);padding:6px 9px;border-radius:6px;background:var(--dispo);color:var(--on-dispo)}
.cons.done .range,.cons.done .who{opacity:.5}
.saisi{font-size:14px;font-weight:600}
.chip{font:600 13px/1 var(--body);padding:7px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chip.x{color:var(--muted)}
.chip.warn{color:var(--gap);border-color:var(--gap)}

/* Messages */
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:2px}
.tab{font:600 14px/1 var(--body);padding:9px 12px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--sunk);color:var(--ink)}
.msgbox{display:flex;flex-direction:column;gap:10px}
.rp{display:flex;flex-direction:column;gap:12px}
.rp textarea{width:100%;min-height:96px;resize:vertical;font-size:15px;line-height:1.45;color:var(--ink)}
.rp textarea.big-ta{min-height:180px}
.rp-quote{margin:0;font-style:italic;color:var(--muted);font-size:14px}
.rp-slots{display:flex;flex-direction:column;gap:8px}
.msgbox textarea{width:100%;min-height:220px;resize:vertical;line-height:1.5;font-size:15px}
.hint{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:12px}
.sugg{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* Réglages */
details.panel > summary{cursor:pointer;font:700 19px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.panel > summary::-webkit-details-marker{display:none}
details.panel > summary::after{content:"+";font-size:24px;color:var(--muted)}
details.panel[open] > summary::after{content:"–"}
.set{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.set + .set{border-top:1px solid var(--line);padding-top:16px}
.set h3{font:600 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.mini{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.mini:last-child{border-bottom:0}
.sel{user-select:all}
.sec.set{margin:0}
.gm-list{display:flex;flex-direction:column;gap:8px}
.gm-row{display:grid;grid-template-columns:24px minmax(0,1fr) 96px 34px;gap:6px 8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.gm-row select,.gm-row input,.hr-row select{width:100%;min-width:0;font-size:16px}
.hr-list{display:flex;flex-direction:column;gap:8px}
.hr-row{display:grid;grid-template-columns:84px minmax(0,1fr) 14px minmax(0,1fr);gap:6px;align-items:center}
.hr-l{font-size:14px;font-weight:600}
.hr-n{grid-column:4;font-size:12px;color:var(--muted);margin-top:-2px;padding-left:4px}
.set select{font-size:16px}
.gm-l{font-size:13px;color:var(--muted)}
.cy-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cy{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;min-width:0}
.cy select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:0;margin:0}
.cy:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.cy small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cy b{font:700 17px/1 var(--display)}
.cy.c-M,.cy.c-A,.cy.c-J{background:var(--dispo);color:var(--on-dispo);border-color:transparent}
.cy.c-M small,.cy.c-A small,.cy.c-J small{color:var(--on-dispo)}
.cy.c-N{background:var(--accent);color:var(--on-accent);border-color:transparent}
.cy.c-N small{color:var(--on-accent)}
.cy.c-R b{color:var(--muted)}
.install{display:flex;flex-direction:column;gap:8px;border-color:var(--accent)}
.install > b{font:700 18px/1.15 var(--display);text-transform:uppercase;letter-spacing:.03em}
.p-relance{background:var(--gap-soft);color:var(--gap);border:0;cursor:pointer;font:600 12px/1 var(--body)}
button.p-relance{padding:4px 8px;border-radius:99px}
.tuto{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.tuto li::marker{font-weight:700;color:var(--accent)}
#aide-det .set > b{font-size:14px}
.set textarea{width:100%;resize:vertical;font-size:13px;color:var(--ink)}

.banner{display:flex;flex-direction:column;gap:4px;border:1px dashed var(--wait);border-radius:10px;padding:12px 14px;font-size:14px;background:var(--wait-soft)}
.banner b{color:var(--wait);font:700 15px/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em}
.loading{padding:40px 0;text-align:center;color:var(--muted)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 1px 8px;border:0;background:transparent;color:var(--muted);font:600 10.5px/1.1 var(--body);cursor:pointer;min-width:0;letter-spacing:-.01em}
.tb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--accent)}
.tb.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tb-badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--gap);color:var(--on-gap);font:700 11px/18px var(--body);text-align:center}
.tb-dot{position:absolute;top:7px;left:calc(50% + 9px);width:9px;height:9px;border-radius:99px;background:var(--gap)}
details.acc > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font:600 14px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary::after{content:"+";font:400 24px/1 var(--body);color:var(--muted)}
details.acc[open] > summary::after{content:"–"}
details.set.acc{display:block}
.acc-body{display:flex;flex-direction:column;gap:12px;padding-top:10px;padding-bottom:4px}
.conf-acc > summary{font-size:13px;color:var(--muted)}
.conf-acc[open] > .panel{margin-top:8px}
.now{display:flex;flex-direction:column;gap:8px;border-color:var(--accent)}
.now-t{font:700 18px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.now-main{margin:0;font-size:16px;line-height:1.4}
.p-trou{background:var(--gap-soft);color:var(--gap)}
#bl-year{width:auto}
.seg-mode{gap:6px}
.seg-mode .chip{flex:1 1 0;text-align:center;padding:10px 12px;font-size:14px}
details.autre{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.autre > summary{text-transform:none;letter-spacing:0;font-size:16px;padding:0}
.autre-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.autre-t small{font:500 13px/1.3 var(--body);color:var(--muted);letter-spacing:0;text-transform:none}
details.autre[open] > .meter{margin-top:10px}
details.autre > .panel{margin-top:10px;border:0;padding:0}
.dispo-meter{background:var(--sunk)}
.dispo-meter span{background:var(--dispo)}
.seg-mode .chip{padding:10px 6px}
.cal{display:flex;flex-direction:column;gap:10px;padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head b{font:700 18px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.cal-head .btn{font-size:20px;padding:4px 14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-w{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-d{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;min-width:0}
.cal-n{font-size:11px;color:var(--muted)}
.cal-d b{font:700 16px/1 var(--display)}
.cal-d.c-M,.cal-d.c-A,.cal-d.c-J,.cal-d.c-X{background:var(--dispo);color:var(--on-dispo);border-color:transparent}
.cal-d.c-N{background:var(--accent);color:var(--on-accent);border-color:transparent}
.cal-d.c-M .cal-n,.cal-d.c-A .cal-n,.cal-d.c-J .cal-n,.cal-d.c-X .cal-n{color:var(--on-dispo)}
.cal-d.c-N .cal-n{color:var(--on-accent)}
.cal-d.c-R b,.cal-d.c-0 b{color:var(--muted)}
.cal-d.c-I{background:var(--gap-soft);color:var(--gap);border-color:transparent}
.cal-d.c-I .cal-n{color:var(--gap)}
.cal-d.ex{outline:2.5px solid var(--wait);outline-offset:-2.5px}
.cal-d.gd::after{content:"";position:absolute;left:22%;right:22%;bottom:3px;height:3px;border-radius:2px;background:var(--gap)}
.cal-d.today .cal-n{font-weight:800;text-decoration:underline}
.cal-d.sel{box-shadow:0 0 0 3px var(--accent)}
.lg-ex,.lg-gd{display:inline-block;width:14px;height:10px;border-radius:3px}
.lg-ex{outline:2px solid var(--wait);outline-offset:-2px}
.legend b.lg-gd{height:4px;width:14px;border-radius:2px;background:var(--gap)}
.legend b.lg-ex{width:14px;height:12px;background:transparent}
.ex-editor{display:flex;flex-direction:column;gap:10px;border-color:var(--accent)}
.view-title{font:700 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}

<body>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Semaine de garde · hors ligne</div>
    <h1>Remplacements de garde</h1>
    <div class="weekbar">
      <select id="weekSel" aria-label="Semaine de garde"></select>
      <button class="btn" id="newWeekBtn" type="button" aria-label="Nouvelle semaine de garde" title="Nouvelle semaine de garde">+ Semaine</button>
    </div>
  </header>
  <main id="app"><div class="loading">Chargement du planning…</div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections" hidden></nav>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
/*LOGIC-START*/
const PAT_DEFAULT = "MMAANNRRRMMAAARRRRMMNNNRRRJMAANNRRR";
const U = 30, CPH = 60 / U, CPD = 1440 / U; // cases de 30 min
const APP_VERSION = "10 nov. 2026 (n°15)";
const GARDE_PRESETS = {
  we: { label: "Week-end + nuits de semaine", modele: [ { j: 0, de: "19:00", aj: 3, a: "07:00" }, { j: 3, de: "19:00", aj: 4, a: "07:00" }, { j: 4, de: "19:00", aj: 5, a: "07:00" }, { j: 5, de: "19:00", aj: 6, a: "07:00" }, { j: 6, de: "19:00", aj: 7, a: "07:00" } ] },
  h24: { label: "7 jours, 24h/24", modele: [ { j: 0, de: "07:00", aj: 7, a: "07:00" } ] },
  nuits: { label: "7 nuits (19h → 7h)", modele: [0, 1, 2, 3, 4, 5, 6].map(k => ({ j: k, de: "19:00", aj: k + 1, a: "07:00" })) }
};
const DEFAULT_REG = {
  nom: "",
  signature: "",
  chef: "",
  cycle: {
    actif: false, ancre: "", motif: "RRRRRRR",
    horaires: { M: "05:00-13:00", A: "13:00-21:00", N: "21:00-05:00", J: "08:00-17:00" },
    finNuitFerie: "",
    trajetMin: 0
  },
  garde: {
    ancre: "", semaines: 4,
    modele: GARDE_PRESETS.we.modele,
    ferie: "07:00-19:00"
  },
  contacts: [],
  semaineActive: null
};
const POSTE = { M: "Matin", A: "Après-midi", N: "Nuit", J: "Journée", R: "Repos", X: "Horaires perso", I: "Indisponible" };
const STATUTS = { attente: "En attente", oui: "Oui", peut: "Peut-être", non: "Non" };
const JOURS = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const JOURS_L = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const MOIS_L = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const RX_PLAGE = /^\d{1,2}:\d{2}-\d{1,2}:\d{2}$/;

// Heures « murales » : tout est calculé en UTC pour ignorer les changements d'heure.
function parseLocal(s){
  if(!s) return NaN;
  const [d, t = "00:00"] = String(s).split("T");
  const [y, m, dd] = d.split("-").map(Number);
  const [hh = 0, mi = 0] = t.split(":").map(Number);
  return Date.UTC(y, m - 1, dd, hh, mi) / 60000; // minutes
}
function dayNum(s){ const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return Date.UTC(y, m - 1, d) / 86400000; }
function dayStr(d){ return new Date(d * 86400000).toISOString().slice(0, 10); }
function hm(s){ const [h, m = 0] = String(s).split(":").map(Number); return h * 60 + m; }
function hourDate(h){ return new Date(h * U * 60000); }
function isoFromHour(h){ return hourDate(h).toISOString().slice(0, 16); }
function hFloor(s){ return Math.floor(parseLocal(s) / U); }
function hCeil(s){ return Math.ceil(parseLocal(s) / U); }
function slotOf(r){ return { s: hFloor(r.debut), e: hCeil(r.fin) }; }
function fmtNum(n){ return Number.isInteger(n) ? String(n) : n.toFixed(1).replace(".", ","); }
function fmtDur(cells){ return fmtNum(cells / CPH) + " h"; }

const _fer = {};
function feries(y){
  if(_fer[y]) return _fer[y];
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  const p = Date.UTC(y, mo - 1, da) / 86400000, D = (mm, dd) => Date.UTC(y, mm - 1, dd) / 86400000;
  return (_fer[y] = new Map([[D(1, 1), "Jour de l'an"], [p + 1, "Lundi de Pâques"], [D(5, 1), "1er mai"], [D(5, 8), "8 mai"], [p + 39, "Ascension"], [p + 50, "Lundi de Pentecôte"], [D(7, 14), "14 juillet"], [D(8, 15), "15 août"], [D(11, 1), "Toussaint"], [D(11, 11), "11 novembre"], [D(12, 25), "Noël"]]));
}
function ferie(d){ return feries(new Date(d * 86400000).getUTCFullYear()).get(d) || ""; }

function cycleCode(d, reg){
  const c = reg.cycle || {};
  if(c.actif === false || !c.ancre) return "";
  const motif = c.motif || "";
  if(!motif.length) return "";
  const i = (((d - dayNum(c.ancre)) % motif.length) + motif.length) % motif.length;
  return motif[i];
}
function posteDuJour(d, reg){
  const hrs = (reg.cycle && reg.cycle.horaires) || {};
  const ex = (reg.exceptions || {})[dayStr(d)];
  if(ex && ex.code){
    const hor = ex.code === "I" ? "00:00-00:00" : ex.code === "X" ? `${ex.de || ""}-${ex.a || ""}` : ex.code === "R" ? "" : hrs[ex.code];
    return { code: ex.code, ex, hor };
  }
  const code = cycleCode(d, reg);
  return { code, ex: null, hor: code && code !== "R" ? hrs[code] : "" };
}
function periodesOf(week){ return Array.isArray(week.periodes) && week.periodes.length ? week.periodes : [{ debut: week.debut, fin: week.fin }]; }
function periodsFor(day, reg){
  const g = reg.garde || DEFAULT_REG.garde, d0 = dayNum(day);
  const per = (g.modele || []).map(p => ({ debut: `${dayStr(d0 + p.j)}T${p.de}`, fin: `${dayStr(d0 + p.aj)}T${p.a}` }));
  if(per.length && g.ferie && RX_PLAGE.test(g.ferie)){
    const s0 = Math.min(...per.map(p => parseLocal(p.debut))), e0 = Math.max(...per.map(p => parseLocal(p.fin)));
    const [fs, fe] = g.ferie.split("-").map(x => x.padStart(5, "0"));
    for(let d = Math.floor(s0 / 1440); d <= Math.floor(e0 / 1440); d++){
      const nom = ferie(d); if(!nom) continue;
      const debut = `${dayStr(d)}T${fs}`, fin = `${dayStr(d)}T${fe}`;
      if(parseLocal(debut) >= s0 && parseLocal(fin) <= e0) per.push({ debut, fin, ferie: nom });
    }
  }
  return per.sort((a, b) => parseLocal(a.debut) - parseLocal(b.debut));
}
function gardeDays(reg, fromDay, n){
  const g = reg.garde || DEFAULT_REG.garde;
  if(!g.ancre || isNaN(dayNum(g.ancre))) return [];
  const a = dayNum(g.ancre), step = (Number(g.semaines) || 4) * 7;
  const k = Math.max(0, Math.ceil((fromDay - a) / step)), out = [];
  for(let i = 0; i < n; i++) out.push(dayStr(a + (k + i) * step));
  return out;
}
function cap(t){ t = String(t || ""); return t.charAt(0).toUpperCase() + t.slice(1); }
function fmtHM(s){ const [h, m = 0] = String(s).split(":").map(Number); return h + "h" + (m ? String(m).padStart(2, "0") : ""); }
function gardeJour(g, k){
  if(!g.ancre || isNaN(dayNum(g.ancre))) return `jour ${k + 1}`;
  return JOURS_L[(new Date(dayNum(g.ancre) * 86400000).getUTCDay() + k) % 7] + (k >= 7 ? " suivant" : "");
}
function gardeDesc(g){
  const mo = (g && g.modele) || [];
  if(!mo.length) return "aucune plage de garde";
  const t = mo.map(p => `${gardeJour(g, p.j)} ${fmtHM(p.de)} → ${gardeJour(g, p.aj)} ${fmtHM(p.a)}`).join(", ");
  return t + (g.ferie && RX_PLAGE.test(g.ferie) ? `, plus la journée des jours fériés (${g.ferie.split("-").map(fmtHM).join(" → ")})` : "");
}

function compute(week, reg){
  const periodes = periodesOf(week);
  let g0 = Infinity, g1 = -Infinity;
  for(const p of periodes){ g0 = Math.min(g0, hFloor(p.debut)); g1 = Math.max(g1, hCeil(p.fin)); }
  if(!(g1 > g0) || g1 - g0 > CPD * 31) return null;
  let plage = null;
  if(week.plage && RX_PLAGE.test(week.plage)) plage = week.plage.split("-").map(x => Math.floor(hm(x) / U));
  const inPlage = h => {
    if(!plage) return true;
    const hod = ((h % CPD) + CPD) % CPD, [s, e] = plage;
    return s < e ? (hod >= s && hod < e) : (hod >= s || hod < e);
  };
  const cells = new Map();
  for(const p of periodes) for(let h = hFloor(p.debut); h < hCeil(p.fin); h++) if(inPlage(h)) cells.set(h, { busy: null, cover: null, rid: null });

  const cyc = reg.cycle || {};
  {
    const tr = Number(cyc.trajetMin) || 0;
    for(let d = Math.floor(g0 / CPD) - 1; d <= Math.floor((g1 - 1) / CPD); d++){
      const pj = posteDuJour(d, reg), code = pj.code, hor = pj.hor;
      if(!hor || !RX_PLAGE.test(hor)) continue;
      let [s, e] = hor.split("-").map(hm);
      if(e <= s) e += 1440;
      if(code === "N" && cyc.finNuitFerie && (ferie(d + 1) || [0, 6].includes(new Date((d + 1) * 86400000).getUTCDay()))) e = 1440 + hm(cyc.finNuitFerie);
      const sm = d * 1440 + s - tr, em = d * 1440 + e + tr;
      for(let h = Math.floor(sm / U); h < Math.ceil(em / U); h++){
        const c = cells.get(h);
        if(c) c.busy = { kind: code === "I" ? "perso" : "poste", code, label: pj.ex ? (pj.ex.note || POSTE[code] || "Travail") : (POSTE[code] || code) };
      }
    }
  }
  for(const a of (week.ajustements || [])){
    for(let h = hFloor(a.debut); h < hCeil(a.fin); h++){
      const c = cells.get(h); if(!c) continue;
      c.busy = a.type === "dispo" ? null : { kind: "perso", label: a.note || "Indispo" };
    }
  }
  for(const r of (week.remplacements || [])){
    for(let h = hFloor(r.debut); h < hCeil(r.fin); h++){
      const c = cells.get(h); if(!c) continue;
      if(r.provisoire){ if(!c.prov) c.prov = r.nom; }
      else { c.cover = r.nom; c.rid = r.id; }
    }
  }
  const hs = [...cells.keys()].sort((a, b) => a - b);
  const runsKey = key => {
    const out = []; let cur = null;
    for(const h of hs){
      const k = key(cells.get(h));
      if(k){ if(cur && cur.e === h && cur.k === k) cur.e = h + 1; else { cur = { s: h, e: h + 1, k }; out.push(cur); } }
      else cur = null;
    }
    return out;
  };
  const runs = pred => runsKey(c => pred(c) ? 1 : null).map(({ s, e }) => ({ s, e }));
  let besoin = 0, reste = 0, att = 0;
  for(const c of cells.values()){ if(c.busy){ besoin++; if(!c.cover){ reste++; if(c.prov) att++; } } }
  return { g0, g1, cells,
    restants: runs(c => c.busy && !c.cover),
    libres: runs(c => c.busy && !c.cover && !c.prov),
    attente: runsKey(c => c.busy && !c.cover && c.prov ? c.prov : null).map(({ s, e, k }) => ({ s, e, nom: k })),
    besoins: runs(c => c.busy), dispos: runs(c => !c.busy),
    besoinH: besoin / CPH, resteH: reste / CPH, attenteH: att / CPH };
}

function dn(n){ return n === 1 ? "1er" : String(n); }
function fmtDay(h, long, fer){
  const d = hourDate(h), base = `${(long ? JOURS_L : JOURS)[d.getUTCDay()]} ${dn(d.getUTCDate())} ${MOIS[d.getUTCMonth()]}`;
  return fer && ferie(Math.floor(h / CPD)) ? base + " (férié)" : base;
}
function fmtH(h){ const d = hourDate(h), m = d.getUTCMinutes(); return d.getUTCHours() + "h" + (m ? String(m).padStart(2, "0") : ""); }
function isMidnight(h){ const d = hourDate(h); return d.getUTCHours() === 0 && d.getUTCMinutes() === 0; }
function fmtSlot({ s, e }){
  const ds = Math.floor(s / CPD), de = Math.floor((e - 1) / CPD), mid = isMidnight(e);
  if(ds === de) return `${fmtDay(s)} · ${fmtH(s)} → ${mid ? "minuit" : fmtH(e)}`;
  return `${fmtDay(s)} ${fmtH(s)} → ${mid ? fmtDay(e - 1) + " minuit" : fmtDay(e) + " " + fmtH(e)}`;
}
function msgSlot({ s, e }){
  const ds = Math.floor(s / CPD), de = Math.floor((e - 1) / CPD), mid = isMidnight(e);
  if(ds === de) return `${fmtDay(s, true, true)} de ${fmtH(s)} à ${mid ? "minuit" : fmtH(e)}`;
  return `du ${fmtDay(s, true, true)} ${fmtH(s)} au ${mid ? fmtDay(e - 1, true) + " minuit" : fmtDay(e, true) + " " + fmtH(e)}`;
}
function weekRange(week){
  const s = new Date(parseLocal(week.debut) * 60000);
  let eMin = parseLocal(week.fin); if(eMin % 1440 === 0) eMin -= 1;
  const e = new Date(eMin * 60000);
  const sd = `${JOURS_L[s.getUTCDay()]} ${dn(s.getUTCDate())}`, ed = `${JOURS_L[e.getUTCDay()]} ${dn(e.getUTCDate())}`;
  if(s.getUTCMonth() === e.getUTCMonth()) return `du ${sd} au ${ed} ${MOIS_L[e.getUTCMonth()]}`;
  return `du ${sd} ${MOIS_L[s.getUTCMonth()]} au ${ed} ${MOIS_L[e.getUTCMonth()]}`;
}
function consH(h){ return isMidnight(h) ? "00h" : fmtH(h); }
function consoleDays(m){
  const out = new Map();
  for(const h of m.cells.keys()){ const d = Math.floor(h / CPD); if(!out.has(d)) out.set(d, []); }
  for(const r of m.dispos){
    let s = r.s;
    while(s < r.e){
      const d = Math.floor(s / CPD), end = Math.min(r.e, (d + 1) * CPD);
      out.get(d).push({ s, e: end });
      s = end;
    }
  }
  return [...out.entries()].sort((a, b) => a[0] - b[0]).map(([d, ranges]) => ({ d, ranges, sig: dayStr(d) + "|" + ranges.map(r => r.s + "-" + r.e).join(",") }));
}
function consoleText(week, m){
  return `Dispos garde ${weekRange(week)}\n` + consoleDays(m).map(x => `${fmtDay(x.d * CPD)} : ${x.ranges.length ? x.ranges.map(r => `${consH(r.s)}-${consH(r.e)}`).join(", ") : "aucune"}`).join("\n");
}
function prenom(n){ return String(n || "").trim().split(/\s+/)[0] || ""; }
function same(a, b){ return String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase(); }
function bullets(list){ return list.map(x => "• " + msgSlot(x)).join("\n"); }
function remplsOf(week, nom){ return (week.remplacements || []).filter(r => same(r.nom, nom) && !r.provisoire).map(slotOf).sort((a, b) => a.s - b.s); }
function provOf(week, nom){ return (week.remplacements || []).filter(r => same(r.nom, nom) && r.provisoire).map(slotOf).sort((a, b) => a.s - b.s); }
function sortedRempl(week){ return (week.remplacements || []).filter(r => !r.provisoire).sort((a, b) => parseLocal(a.debut) - parseLocal(b.debut)); }
function sortedProv(week){ return (week.remplacements || []).filter(r => r.provisoire).sort((a, b) => parseLocal(a.debut) - parseLocal(b.debut)); }
function gapReasons(g, m){
  const set = new Set();
  for(let h = g.s; h < g.e; h++){ const c = m.cells.get(h); if(c && c.busy) set.add(c.busy.label); }
  return [...set];
}

function genMessage(tab, dest, week, m, reg){
  const wr = weekRange(week), tu = !!dest;
  const g = tu ? `Salut ${prenom(dest)},` : "Salut à tous,";
  const sg = reg.signature ? "\n" + reg.signature : "";
  const rest = m.restants;
  const onlyWork = rest.every(x => { for(let h = x.s; h < x.e; h++){ const c = m.cells.get(h); if(c && c.busy && c.busy.kind !== "poste") return false; } return true; });
  const pourquoi = onlyWork ? "je bosse sur certains créneaux" : "je ne suis pas dispo sur certains créneaux";
  const someCovered = sortedRempl(week).length > 0;
  const libres = m.libres, att = m.attente;
  const attBlock = att.length ? `\nCeux-là sont peut-être pris, j'attends une confirmation :\n${bullets(att)}` : "";
  const attHint = "Tout ce qui reste est en attente de confirmation : attends les réponses avant de redemander.";
  switch(tab){
    case "demande":
      if(!rest.length) return { text: "", hint: "Tout est couvert : pas de demande à envoyer." };
      if(!libres.length) return { text: "", hint: attHint };
      return { text: `${g}\nJe suis de garde ${wr} mais ${pourquoi}. ${tu ? "Tu pourrais" : "Quelqu'un pourrait"} me remplacer sur un de ceux-là ?\n${bullets(libres)}${attBlock}\nMême une partie d'un créneau, ça m'aide. ${tu ? "Dis-moi ce qui t'arrange" : "Dites-moi ce qui vous arrange"}. Merci !${sg}` };
    case "relance": {
      const pv = tu ? provOf(week, dest) : [];
      if(pv.length) return { text: `${g}\nTu peux me confirmer pour ma garde ${wr} ?\n${bullets(pv)}\nDis-moi dès que tu sais. Merci !${sg}` };
    }
      if(!rest.length) return { text: "", hint: "Plus rien à couvrir : utilise plutôt « Clôture » pour prévenir ceux qui n'ont pas répondu." };
      if(!libres.length) return { text: "", hint: attHint };
      return { text: `${g}\nPetite relance pour ma garde ${wr}. ${someCovered ? "Une partie est déjà prise, il" : "Il"} me reste ces créneaux :\n${bullets(libres)}${attBlock}\n${tu ? "Si tu peux en prendre un, même en partie, fais-moi signe" : "Si quelqu'un peut en prendre un, même en partie, faites-moi signe"}. Merci !${sg}` };
    case "merci": {
      if(!dest) return { text: "", hint: "Choisis la personne qui a accepté." };
      const mine = remplsOf(week, dest);
      if(!mine.length) return { text: "", hint: `Aucun créneau enregistré pour ${dest}. Ajoute-le depuis « À couvrir ».` };
      return { text: `Merci ${prenom(dest)} ! Je te note sur :\n${bullets(mine)}\nJe mets le planning de garde à jour.${sg}` };
    }
    case "cloture":
      if(rest.length) return { text: "", hint: `Il reste ${fmtNum(m.resteH)} h à couvrir : envoie plutôt une relance.` };
      return { text: `${g}\nC'est bon pour ma garde ${wr}, tout est couvert. Merci quand même d'avoir regardé !${sg}` };
    case "recap": {
      const rs = sortedRempl(week);
      let t = `${reg.chef ? `Salut ${prenom(reg.chef)},` : "Bonjour,"}\nVoici les remplacements pour ma garde ${wr} :\n`;
      t += rs.length ? rs.map(r => `• ${msgSlot(slotOf(r))} : ${r.nom}`).join("\n") : "Aucun remplacement confirmé pour l'instant.";
      if(att.length) t += `\n\nEn attente de confirmation :\n${att.map(a => `• ${msgSlot(a)} : ${a.nom} (à confirmer)`).join("\n")}`;
      if(libres.length) t += `\n\nIl me reste à couvrir :\n${bullets(libres)}`;
      if(!rest.length) t += "\n\nToute ma garde est couverte.";
      return { text: t + sg };
    }
  }
  return { text: "" };
}

function chefRetraitMsg(week, m, reg, nom, slot){
  const g = reg.chef ? `Salut ${prenom(reg.chef)},` : "Bonjour,";
  const sg = reg.signature ? "\n" + reg.signature : "";
  const tail = [];
  if(m.attente.length) tail.push(`En attente de confirmation :\n${m.attente.map(a => `• ${msgSlot(a)} (${a.nom})`).join("\n")}`);
  if(m.libres.length) tail.push(`Au total, il me reste à couvrir :\n${bullets(m.libres)}`);
  return `${g}\nPour info, sur ma garde ${weekRange(week)}, ${nom} ne pourra finalement pas assurer :\n${bullets([slot])}\nJe cherche quelqu'un d'autre.${tail.length ? "\n" + tail.join("\n") : ""}${sg}`;
}
function chefMsg(week, m, reg, nom, slots){

function interpret(res, m, nom, txt){

    const s = hFloor(c && c.debut), e = hCeil(c && c.fin);
    if(!(e > s)) continue;

    for(const g of m.restants){ const a = Math.max(s, g.s), b = Math.min(e, g.e); if(b > a){ pieces.push({ s: a, e: b, on: true }); inside += b - a; } }

  for(const p of pieces){ const l = merged[merged.length - 1]; if(l && p.s <= l.e) l.e = Math.max(l.e, p.e); else merged.push({ ...p }); }

// Lecture d'une réponse directement sur le téléphone (sans Internet).
function normTxt(t){ return String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’'`]/g, " ").replace(/[–—]/g, "-").replace(/\s+/g, " "); }

const RX_OUI = /\b(oui|ouais|ouai|ok|okay|okk|yes|yep|carrement|pas de (souci|soucis|probleme|pb)|aucun (souci|probleme)|ca marche|ca me va|ca roule|vas[ -]?y|je prends|je peux|je te prends|dispo|banco|valide|c est bon|avec plaisir|d accord|dac)\b/;
const RX_JOURS = /\b(dimanche|lundi|mardi|mercredi|jeudi|vendredi|samedi|week[ -]?end|we)\b/g;
const JOUR_IDX = { dimanche: 0, lundi: 1, mardi: 2, mercredi: 3, jeudi: 4, vendredi: 5, samedi: 6 };

function parseReply(txt, m){
  const days = [];
  for(let d = Math.floor(m.g0 / CPD); d <= Math.floor((m.g1 - 1) / CPD); d++) days.push(d);
  const gaps = m.restants;
  const startsOn = d => gaps.filter(g => Math.floor(g.s / CPD) === d);
  const overlapsDay = d => gaps.filter(g => g.s < (d + 1) * CPD && g.e > d * CPD);
  const hcell = (h, mn) => Math.round(((Number(h) || 0) * 60 + (Number(mn) || 0)) / U);

  let t = normTxt(txt).replace(/\bmidi\b/g, "12h").replace(/\bminuit\b/g, "24h");
  // « je te redis lundi » : ce jour-là est la date de la réponse, pas un créneau
  t = t.replace(/(redis|redirai|dis|confirme|confirmerai|reviens vers (toi|vous)|recontacte|rappelle|tiens au courant)( (ca|ca te|le|d ici|avant|pour))* (demain|ce soir|dimanche|lundi|mardi|mercredi|jeudi|vendredi|samedi)/g, "$1");
  const clauses = t.split(/[.;!?\n]+|,|\bmais\b|\bpar contre\b|\bsinon\b|\bpar ailleurs\b/).map(c => c.trim()).filter(Boolean);

  const picks = [], negDays = new Set(), loose = [], allMentions = [];
  let anyNeg = false, anyNegNoDay = false, anyPos = false, anyDayOrTime = false, lastMention = null;
  const anyPeut = RX_PEUT.test(t);

  for(const c0 of clauses){
    let c = c0;
    const neg = RX_NON.test(c), pos = RX_OUI.test(c);
    // Jours explicitement exclus : « sauf samedi », « pas le dimanche »
    const exclus = new Set();
    c = c.replace(/\b(sauf|a part|hormis|excepte|pas)( (le|la|pour le|pour la|pour|ce|cette))? (dimanche|lundi|mardi|mercredi|jeudi|vendredi|samedi)\b/g, (all, a, b, c2, j) => { exclus.add(JOUR_IDX[j]); return " ".repeat(all.length); });
    exclus.forEach(j => days.filter(d => new Date(d * 86400000).getUTCDay() === j).forEach(d => negDays.add(d)));

    // Jours cités
    const mentions = [];
    for(const mm of c.matchAll(RX_JOURS)){
      const w = mm[1], after = c.slice(mm.index + w.length, mm.index + w.length + 12), before = c.slice(Math.max(0, mm.index - 10), mm.index);
      const we = w.startsWith("we");
      const part = we ? "we" : /^\s*(matin)/.test(after) ? "matin" : (/^\s*(soir|nuit|apres[ -]?midi|aprem)/.test(after) || /nuit (de |du )?$/.test(before)) ? "soir" : "";
      const js = we ? [5, 6, 0] : [JOUR_IDX[w]];
      const ds = days.filter(d => js.includes(new Date(d * 86400000).getUTCDay()));
      if(ds.length) mentions.push({ i: mm.index, ds, part });
    }
    const dateHits = [
      ...c.matchAll(new RegExp("\\b(\\d{1,2})(?:er)? " + RX_MOIS, "g")),
      ...c.matchAll(/\b(?:le|du|au) (\d{1,2})(?:er)?\b(?! ?(?:h|:|\d))/g)
    ];
    const seenDate = new Set();
    for(const mm of dateHits){
      if(seenDate.has(mm.index + mm[0].length)) continue;
      seenDate.add(mm.index + mm[0].length);
      const n = Number(mm[1]);
      const ds = days.filter(d => new Date(d * 86400000).getUTCDate() === n);
      if(ds.length) mentions.push({ i: mm.index, ds, part: "" });
    }
    mentions.sort((a, b) => a.i - b.i);

    // Heures citées
    const times = [];
    let rest = c;
    const rxRange = /(?:de |entre |des |a partir de )?(\d{1,2}) ?(h|:)? ?(\d{2})? ?(?:a|au|-|\/|et|jusqu a|->|→) ?(\d{1,2}) ?(h|:)? ?(\d{2})?/g;
    for(const mm of c.matchAll(rxRange)){
      if(!mm[2] && !mm[5]) continue; // « du 5 au 8 » : des dates, pas des heures
      times.push({ i: mm.index, s: hcell(mm[1], mm[3]), e: hcell(mm[4], mm[6]) });
      rest = rest.slice(0, mm.index) + " ".repeat(mm[0].length) + rest.slice(mm.index + mm[0].length);
    }
    for(const mm of rest.matchAll(/(a partir de|des|depuis) ?(\d{1,2}) ?(h|:) ?(\d{2})?/g)) times.push({ i: mm.index, s: hcell(mm[2], mm[4]), e: null });
    for(const mm of rest.matchAll(/(jusqu a|avant) ?(\d{1,2}) ?(h|:) ?(\d{2})?/g)) times.push({ i: mm.index, s: null, e: hcell(mm[2], mm[4]) });

    if(mentions.length || times.length) anyDayOrTime = true;
    if(neg){
      anyNeg = true;
      if(!mentions.length && !exclus.size) anyNegNoDay = true;
      mentions.forEach(x => x.ds.forEach(d => negDays.add(d)));
      lastMention = null;
      continue;
    }
    if(pos || mentions.length || times.length) anyPos = true;

    mentions.forEach(x => { x.times = []; allMentions.push(x); });
    for(const tm of times){
      let owner = null;
      for(const x of mentions) if(x.i <= tm.i) owner = x;
      if(!owner) owner = lastMention || mentions[0] || null;
      if(!owner){ loose.push(tm); continue; }
      owner.times.push(tm);
    }
    if(mentions.length) lastMention = mentions[mentions.length - 1];
  }
  for(const x of allMentions){
    for(const d of x.ds){
      if(x.times.length) x.times.forEach(tm => picks.push(...applyTime(d, tm)));
      else picks.push(...dayGaps(d, x.part, d));
    }
  }
  function dayGaps(d, part){
    if(part === "we"){ const fri = new Date(d * 86400000).getUTCDay() === 5; return startsOn(d).filter(g => !fri || g.s >= d * CPD + 12 * CPH); }
    if(part === "matin") return overlapsDay(d).map(g => ({ s: Math.max(g.s, d * CPD), e: Math.min(g.e, d * CPD + 12 * CPH) })).filter(g => g.e > g.s);
    if(part === "soir"){ const l = startsOn(d).filter(g => g.s >= d * CPD + 12 * CPH); return l.length ? l : overlapsDay(d).filter(g => g.e > d * CPD + 17 * CPH); }
    const l = startsOn(d); return l.length ? l : overlapsDay(d);
  }
  function applyTime(d, tm){
    const base = d * CPD;
    if(tm.s != null && tm.e != null){ let s = base + tm.s, e = base + tm.e; if(e <= s) e += CPD; return [{ s, e }]; }
    if(tm.s != null){ const s = base + tm.s; return gaps.filter(g => g.e > s && g.s < base + CPD).map(g => ({ s: Math.max(g.s, s), e: g.e })); }
    const cands = startsOn(d).length ? startsOn(d) : overlapsDay(d);
    let e = base + tm.e;
    if(cands.length && e <= cands[0].s) e += CPD;
    return cands.filter(g => g.s < e).map(g => ({ s: g.s, e: Math.min(g.e, e) }));
  }
  for(const tm of loose) for(const d of days) picks.push(...applyTime(d, tm).filter(p => Math.floor(p.s / CPD) === d));

  const iso = list => list.map(p => ({ debut: isoFromHour(p.s), fin: isoFromHour(p.e) }));
  const douteJour = loose.length ? "Aucun jour précisé pour les heures : vérifie les créneaux cochés." : "";

  }

  }
  if(anyPos && !anyDayOrTime && anyNeg){
    if(negDays.size) return { statut: anyPeut ? "peut" : "oui", creneaux: iso(gaps.filter(g => !negDays.has(Math.floor(g.s / CPD)))), doute: "" };

  }
  if(anyNeg) return { statut: "non", creneaux: [], doute: "" };
  if(anyPeut) return { statut: "peut", creneaux: [], doute: "Pas encore de créneau précis dans la réponse." };
  return { statut: "peut", creneaux: [], doute: "Je n'ai pas compris cette réponse : choisis toi-même la réponse et les créneaux." };
}
function resumeOf(r){
  const p = prenom(r.nom);
  if(r.statut === "non") return `${p} ne peut pas.`;
  if(!r.pieces.length) return `${p} n'est pas encore sûr.`;
  return `${p} ${r.statut === "peut" ? "pourrait prendre" : "prend"} : ${r.pieces.map(fmtSlot).join(" + ")}.`;
}

let chain = Promise.resolve();
function q(fn){
  chain = chain.then(fn).catch(err => {
    const code = err && err.code;
    if(code === "invalid_argument" || code === "not_granted"){ S.readOnly = true; S.notice = "Ce planning est en lecture seule pour toi : tes modifications ne sont pas enregistrées."; }

}

  const list = clone(week.demandes || []);
  const i = list.findIndex(d => same(d.nom, nom));

function boardView(m, reg){

function autresGardesDispo(reg, n){
  const mine = equipeOf(reg); if(!mine) return null;
  const now = parseLocal(nowLocal()), today = dayNum(nowLocal()), out = [];
  for(const k of Object.keys(CENTRE.equipes)){
    if(k === mine) continue;
    const g = gardeEquipe(k);
    for(const d of gardeDays({ garde: g }, today - 7, 4)){
      const per = periodsFor(d, { garde: g }); if(!per.length) continue;
      const fin = per.reduce((x, p) => parseLocal(p.fin) > parseLocal(x) ? p.fin : x, per[0].fin);
      if(parseLocal(fin) < now) continue;
      const week = { id: d, debut: per[0].debut, fin, periodes: per, ajustements: [], remplacements: [] };
      const m = compute(week, reg); if(!m) continue;
      let libres = 0; for(const c of m.cells.values()) if(!c.busy) libres++;
      out.push({ d, eq: k, week, m, dispoH: libres / CPH, totalH: m.cells.size / CPH });
    }
  }
  return out.sort((a, b) => dayNum(a.d) - dayNum(b.d)).slice(0, n);
}

function joursDeGarde(reg, d0, d1){
  const set = new Set();
  const mark = per => { for(const p of per){ const a = Math.floor(parseLocal(p.debut) / 1440), b = Math.floor((parseLocal(p.fin) - 1) / 1440); for(let d = a; d <= b; d++) set.add(d); } };
  for(const w of S.weeks) if(!(w.remplacements || []).some(r => r.echange)) mark(periodesOf(w));
  for(const g of gardeDays(reg, d0 - 14, 4)) if(!S.weeks.some(w => w.id === g)) mark(periodsFor(g, reg));
  return set;
}

function partInfo(nom, sl, s, e){
  if(!(e > s)) return "L'heure de fin doit être après le début.";
  const kept = [];
  if(s > sl.s) kept.push({ s: sl.s, e: s });
  if(e < sl.e) kept.push({ s: e, e: sl.e });
  const p = prenom(nom);
  return `Redevient à couvrir : ${fmtSlot({ s, e })} (${fmtDur(e - s)}). ` + (kept.length ? `${p} garde : ${kept.map(k => `${fmtSlot(k)} (${fmtDur(k.e - k.s)})`).join(" et ")}.` : `${p} ne fait plus rien sur ce créneau.`);
}
function hourOptions(from, to, selected){
  let o = "";
  const multi = Math.floor(from / CPD) !== Math.floor(to / CPD);
  for(let h = from; h <= to; h++){
    const lab = multi ? `${JOURS[hourDate(h).getUTCDay()]} ${fmtH(h)}` : fmtH(h);
    o += `<option value="${h}"${h === selected ? " selected" : ""}>${esc(lab)}</option>`;
  }
  return o;
}

function hhmm(v){ if(v == null || v === "") return ""; const [h, m = 0] = String(v || "").split(":").map(Number); return isNaN(h) ? "" : String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0"); }
function hourSelOpts(sel, ref){
  const cur = hhmm(sel), list = [];
  for(let h = 0; h < 24; h++) for(const m of [0, 30]) list.push(String(h).padStart(2, "0") + ":" + (m ? "30" : "00"));
  if(cur && !list.includes(cur)) list.push(cur), list.sort();
  return list.map(v => `<option value="${v}"${v === cur ? " selected" : ""}>${fmtHM(v)}${ref != null && hm(v) <= hm(ref) ? " (lendemain)" : ""}</option>`).join("");
}
function numOpts(vals, sel, unit){ return vals.map(v => `<option value="${v}"${Number(sel) === v ? " selected" : ""}>${v}${unit || ""}</option>`).join(""); }
function range(a, b){ const o = []; for(let i = a; i <= b; i++) o.push(i); return o; }
function posteOpts(code){ return ["R", "M", "A", "N", "J"].map(k => `<option value="${k}"${k === code ? " selected" : ""}>${POSTE[k]}</option>`).join(""); }
function hrRow(k, val){

      <label for="ex-ma">Ta garde, qu'il fera<select id="ex-ma">${mg.map(d => `<option value="${d}">${esc(cap(fmtDay(dayNum(d) * CPD, true)))}</option>`).join("")}</select></label>
      ${autres ? `<label for="ex-sa">Sa garde, que tu feras<select id="ex-sa">${autres.map(o => `<option value="${o.d}">Équipe ${o.eq} · ${esc(fmtDay(dayNum(o.d) * CPD, true))}</option>`).join("")}</select></label>`
        : `<label for="ex-sa">Sa garde commence le<input type="date" id="ex-sa"></label>`}
      <span class="item-sub">Ta garde passe entièrement à son nom, et sa semaine s'ajoute à ton planning avec ton cycle de travail.</span>
      <div class="actions"><button type="button" class="btn primary" data-act="ex-ok">Enregistrer l'échange</button><button type="button" class="btn ghost" data-act="ex-cancel">Annuler</button></div>
    </div></div>`;
  } else exForm = `<div class="addrow"><button type="button" class="btn small" data-act="ex-open"${ro}>Noter un échange de garde</button></div>`;
  const exSec = `<section class="sec"><h3>Échanges de garde</h3><div class="panel list">${exList || `<div class="item"><span class="muted">Tu échanges ta semaine avec quelqu'un d'une autre équipe ? Note-le ici : les deux plannings se mettent à jour.</span></div>`}${exForm}</div></section>`;
  return bilan + rdSec + exSec;
}

function newWeekView(){
  const reg = currentReg(), today = dayNum(nowLocal());
  const def = gardeDays(reg, today - 6, 8).find(d => !S.weeks.some(x => x.id === d)) || gardeDays(reg, today, 1)[0];
  return `<section class="panel sec" aria-label="Nouvelle semaine"><h2>Nouvelle semaine de garde</h2>

function createWeek(day){
  if(!S.db || S.readOnly) return;
  if(S.weeks.some(w => w.id === day)){ S.activeId = day; S.ui.newWeek = false; render(); return; }
  const per = periodsFor(day, currentReg());
  if(!per.length){ toast("Le modèle de garde est vide"); return; }
  const fin = per.reduce((m, p) => parseLocal(p.fin) > parseLocal(m) ? p.fin : m, per[0].fin);
  const body = { debut: per[0].debut, fin, periodes: per, ajustements: [], remplacements: [], demandes: [], creeLe: nowLocal() };
  S.ui.newWeek = false; S.activeId = day;
  S.weeks = [...S.weeks, { id: day, ...body }];
  q(() => S.db.collection("semaines").doc(day).set(body));
  saveReg({ semaineActive: day });
  render(); toast("Semaine préparée");
}

function render(){
  pendingRender = false;
  const app = $("#app");
  renderWeekBar();
  if(S.dbResolved && !S.db){
    app.innerHTML = `<div class="panel sec"><h2>Planning indisponible ici</h2><p class="muted">Ouvre cette page depuis claude.ai, connecté à ton compte, pour voir et modifier tes semaines de garde.</p></div>`;
    return;
  }
  if(!S.weeksLoaded){ app.innerHTML = `<div class="loading">Chargement du planning…</div>${S.notice ? `<div class="notice">${esc(S.notice)}</div>` : ""}`; return; }
  const reg = currentReg(), week = activeWeek();
  let html = (S.notice ? `<div class="notice">${esc(S.notice)}</div>` : "");
  if(S.ui.newWeek) html += newWeekView();
  if(!week){
    renderTabbar(false); setBodyView("");
    html = installCard() + html;
    if(!S.ui.newWeek){
      const vide = !S.weeks.length && !S.reg;
      html += vide
        ? setupView()
        : `<section class="panel sec"><h2>Aucune semaine de garde</h2><p class="muted">Choisis ta prochaine garde dans la liste en haut (rubrique « À préparer »), ou restaure une sauvegarde dans les réglages.</p><div class="actions"><button type="button" class="btn primary" data-act="nw">Nouvelle semaine</button></div></section>`;

  }
  const ppl = people(week, reg);
  html += `<datalist id="people">${ppl.map(n => `<option value="${esc(n)}"></option>`).join("")}</datalist>`;
  if(week.exemple) html += `<div class="banner"><b>Semaine d'exemple</b><span>Les collègues et les réponses sont fictifs, pour montrer le fonctionnement. Donne ta vraie semaine de garde à Claude ou crée-la avec « Nouvelle semaine ».</span></div>`;
  const m = compute(week, reg);
  if(!m){
    S.ui.settingsOpen = true;
    html += `<div class="notice"><b>Période invalide.</b> La fin doit être après le début (31 jours maximum). Corrige-la ci-dessous.</div>` + settingsView(week, reg);
    renderTabbar(false); app.innerHTML = html; bindAfter(); return;
  }
  const view = S.ui.view || "garde";
  setBodyView("has-tabs view-" + view);
  renderTabbar(true, week, m, reg);
  if(view === "garde") html += installCard() + backupBanner(reg) + nowCard(week, reg) + summaryView(m, week) + boardView(m, reg) + gapsView(m, week);
  else if(view === "entraide") html += entraideView(reg);
  else if(view === "messages") html += messagesView(m, week, reg);
  else if(view === "reponses") html += rpView(week, m, reg) + suiviView(week);
  else if(view === "dispos"){ const dm = S.ui.dispoMode || "moi"; html += dispoModeChips() + (dm === "autres" ? autresView(reg) : dm === "travail" ? travailView(reg) : ajView(week, m) + consoleView(week, m)); }
  else {
    S.ui.settingsOpen = true;
    html += `<h2 class="view-title">Réglages</h2>` + backupBanner(reg) + settingsView(week, reg) + aideView()
      + `<p class="tip">Cette appli marche sans Internet : tout reste sur ce téléphone. Pour que Claude mette à jour ton planning, envoie-lui une sauvegarde (Réglages › Sauvegarde). Version du ${esc(APP_VERSION)}.</p>`;
  }
  app.innerHTML = html;
  bindAfter();
}

function updateReste(){
  const box = $(".assign"), el = $("#as-reste"); if(!box || !el) return;
  const gs = Number(box.dataset.gs), ge = Number(box.dataset.ge), s = Number($("#as-s").value), e = Number($("#as-e").value);
  if(!(e > s)){ el.textContent = "L'heure de fin doit être après le début."; return; }
  const parts = [];
  if(s > gs) parts.push({ s: gs, e: s });
  if(e < ge) parts.push({ s: e, e: ge });
  el.textContent = parts.length ? `Pris : ${fmtSlot({ s, e })} (${fmtDur(e - s)}). Restera à couvrir : ${parts.map(p => `${fmtSlot(p)} (${fmtDur(p.e - p.s)})`).join(" et ")}.` : "Le créneau sera entièrement couvert.";
}
function toast(t){
  const el = $("#toast"); el.textContent = t; el.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.hidden = true; }, 2200);
}

$("#weekSel").addEventListener("change", e => {

  S.ui.assign = null; S.ui.confirm = null; S.ui.dest = "";
  if(v.startsWith("new:")){ createWeek(v.slice(4)); return; }
  S.activeId = v; render();

});
$("#newWeekBtn").addEventListener("click", () => { S.ui.newWeek = true; render(); const el = $("#nw-day"); if(el) el.focus(); });

$("#app").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, week = activeWeek(), reg = currentReg();
  switch(act){
    case "nw": S.ui.newWeek = true; render(); break;
    case "nw-cancel": S.ui.newWeek = false; render(); break;
    case "nw-ok": { const day = ($("#nw-day") || {}).value; if(!day){ toast("Choisis une date"); return; } createWeek(day); break; }
    case "regen": {
      const day = /^\d{4}-\d{2}-\d{2}$/.test(week.id) ? week.id : String(week.debut).slice(0, 10);
      const per = periodsFor(day, reg); if(!per.length) return;
      const fin = per.reduce((m, p) => parseLocal(p.fin) > parseLocal(m) ? p.fin : m, per[0].fin);
      saveWeek(week.id, { periodes: per, debut: per[0].debut, fin });
      toast("Plages recalculées"); break;
    }
    case "goto": {
      const h = Number(b.dataset.h), m = compute(week, reg);
      const g = m && m.libres.find(x => h >= x.s && h < x.e);
      if(!g) return;
      S.ui.assign = `${g.s}-${g.e}`; render();
      const el = document.getElementById("gap-" + S.ui.assign);
      if(el){ el.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "center" }); setTimeout(() => { const i = $("#as-nom"); if(i) i.focus({ preventScroll: true }); }, reduced ? 0 : 350); }
      break;
    }
    case "assign": S.ui.assign = b.dataset.key; render(); { const i = $("#as-nom"); if(i) i.focus(); } break;
    case "assign-cancel": S.ui.assign = null; render(); break;
    case "as-mode": {
      const partie = b.dataset.v === "partie", box = b.closest(".assign");
      box.querySelectorAll('[data-act="as-mode"]').forEach(x => { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-checked", String(on)); });
      $("#as-hours").hidden = !partie;
      if(!partie){ $("#as-s").value = box.dataset.gs; $("#as-e").value = box.dataset.ge; }
      updateReste();
      if(partie) $("#as-s").focus();
      break;
    }
    case "assign-ok": {
      const nom = ($("#as-nom").value || "").trim();
      const s = Number($("#as-s").value), en = Number($("#as-e").value);
      if(!nom){ toast("Indique qui te remplace"); $("#as-nom").focus(); return; }
      if(!(en > s)){ toast("L'heure de fin doit être après le début"); return; }
      const prov = !!($("#as-prov") || {}).checked;
      const rempl = [...clone(week.remplacements || []), { id: uid("r"), nom, debut: isoFromHour(s), fin: isoFromHour(en), ...(prov ? { provisoire: true } : {}) }];
      const demandes = upsertDemande(week, nom, d => ({ ...(d || { id: uid("d"), nom }), statut: prov ? "peut" : "oui", maj: nowLocal() }));
      S.ui.assign = null;
      saveWeek(week.id, { remplacements: rempl, demandes });
      ensureContact(nom);
      if(!prov){ S.ui.tab = "merci"; S.ui.dest = nom; }
      toast(`${prenom(nom)} noté${prov ? " (à confirmer)" : ""} sur ${fmtSlot({ s, e: en })}`);
      break;
    }
    case "confirm": S.ui.confirm = b.dataset.v; render(); break;
    case "unconfirm": S.ui.confirm = null; render(); break;
    case "rm-rempl-ok": {
      S.ui.confirm = null;
      saveWeek(week.id, { remplacements: (week.remplacements || []).filter(r => r.id !== b.dataset.id) });
      toast("Remplacement retiré");
      break;
    }
    case "tab": S.ui.tab = b.dataset.v; render(); break;
    case "dest": S.ui.dest = b.dataset.v; render(); break;
    case "copy": {
      const ta = $("#msg"); if(!ta) return;
      const text = ta.value, tab = S.ui.tab, dest = S.ui.dest;
      const after = () => {
        toast("Message copié");
        if(dest && (tab === "demande" || tab === "relance") && !S.readOnly){
          const demandes = upsertDemande(week, dest, d => d
            ? { ...d, maj: nowLocal(), note: tab === "relance" ? "Relancé" : d.note || "" }
            : { id: uid("d"), nom: dest, statut: "attente", maj: nowLocal(), note: "" });
          saveWeek(week.id, { demandes });
        }
      };
      let p;
      try { p = navigator.clipboard.writeText(text); } catch(err){ p = Promise.reject(err); }
      p.then(after, () => { ta.focus(); ta.select(); toast("Texte sélectionné : copie-le avec ton téléphone"); });
      break;
    }
    case "rp-go": {
      const txt = (S.ui.rpTxt || "").trim(), nom = (S.ui.rpNom || "").trim();
      if(!txt){ toast("Colle d'abord la réponse"); return; }
      if(!nom){ toast("Indique de qui vient la réponse"); const i = $("#rp-nom"); if(i) i.focus(); return; }
      runAnalyse(week, reg, nom, txt);
      break;
    }
    case "rp-stop": if(rpCtl) rpCtl.abort(); break;
    case "rp-cancel": S.ui.rp = null; render(); break;
    case "rp-reset": S.ui.rpDone = null; render(); { const i = $("#rp-nom"); if(i) i.focus(); } break;
    case "rp-statut": if(S.ui.rp){ S.ui.rp.statut = b.dataset.v; render(); } break;
    case "rp-ok": {
      const r = S.ui.rp; if(!r) return;
      const nomIn = (($("#rp-nom2") || {}).value || "").trim(); if(nomIn) r.nom = nomIn;
      const chosen = r.statut !== "non" ? r.pieces.filter(p => p.on) : [];
      if(r.statut === "oui" && !chosen.length){ toast("Coche au moins un créneau, ou choisis Peut-être ou Non"); return; }
      const newR = chosen.map(p => ({ id: uid("r"), nom: r.nom, debut: isoFromHour(p.s), fin: isoFromHour(p.e), ...(r.statut === "peut" ? { provisoire: true } : {}) }));
      const base = clone(week.remplacements || []).filter(x => !(x.provisoire && same(x.nom, r.nom)));
      const rempl = [...base, ...newR];
      const oldLen = (week.remplacements || []).length;
      const shortTxt = r.txt.length > 120 ? r.txt.slice(0, 117) + "…" : r.txt;
      const demandes = upsertDemande(week, r.nom, d => ({ ...(d || { id: uid("d"), nom: r.nom }), statut: r.statut, maj: nowLocal(), note: r.resume || shortTxt }));
      saveWeek(week.id, newR.length || base.length !== oldLen ? { remplacements: rempl, demandes } : { demandes });
      ensureContact(r.nom);
      const m2 = compute({ ...week, remplacements: rempl }, reg);
      S.ui.rpDone = { nom: r.nom, statut: r.statut, chef: r.statut === "oui" && newR.length && m2 ? chefMsg(week, m2, reg, r.nom, chosen) : "" };
      S.ui.rp = null; S.ui.rpTxt = ""; S.ui.rpNom = "";
      render(); toast("Planning mis à jour");
      break;
    }
    case "rp-copy": {
      const ta = $("#rp-chef"); if(!ta) return;
      let p;
      try { p = navigator.clipboard.writeText(ta.value); } catch(err){ p = Promise.reject(err); }
      p.then(() => toast("Message copié"), () => { ta.focus(); ta.select(); toast("Texte sélectionné : copie-le avec ton téléphone"); });
      break;
    }
    case "part-open": {
      S.ui.part = b.dataset.id; S.ui.confirm = null; render();
      const el = document.getElementById("rempl-" + b.dataset.id);
      if(el){ el.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "center" }); setTimeout(() => { const i = $("#pt-s"); if(i) i.focus({ preventScroll: true }); }, reduced ? 0 : 350); }
      break;
    }
    case "part-cancel": S.ui.part = null; render(); break;
    case "part-ok": {
      const r0 = (week.remplacements || []).find(x => x.id === b.dataset.id); if(!r0) return;
      const sl = slotOf(r0), s = Number($("#pt-s").value), e = Number($("#pt-e").value);
      if(!(e > s)){ toast("L'heure de fin doit être après le début"); return; }
      const kept = [];
      if(s > sl.s) kept.push({ s: sl.s, e: s });
      if(e < sl.e) kept.push({ s: e, e: sl.e });
      const rempl = (week.remplacements || []).filter(x => x.id !== r0.id).concat(kept.map(k => ({ ...clone(r0), id: uid("r"), debut: isoFromHour(k.s), fin: isoFromHour(k.e) })));
      const encore = rempl.some(x => same(x.nom, r0.nom));
      const libere = { s, e };
      const demandes = upsertDemande(week, r0.nom, d => ({ ...(d || { id: uid("d"), nom: r0.nom }), statut: encore ? ((d && d.statut) || "oui") : "non", maj: nowLocal(), note: `S'est désisté : ${fmtSlot(libere)}` }));
      saveWeek(week.id, { remplacements: rempl, demandes });
      const m2 = compute({ ...week, remplacements: rempl }, reg);
      S.ui.part = null; S.ui.rp = null; S.ui.tab = "relance"; S.ui.dest = "";
      S.ui.rpDone = { nom: r0.nom, statut: encore ? "oui" : "non", titre: `${prenom(r0.nom)} ne fait plus ${fmtSlot(libere)} : ce créneau est de nouveau à couvrir.`, chef: m2 ? chefRetraitMsg(week, m2, reg, r0.nom, libere) : "" };
      render(); toast("Partie retirée du planning");
      goTab("reponses", "rp-sec");
      break;
    }
    case "rp-relance": {
      S.ui.tab = "relance"; S.ui.dest = ""; render();
      goTab("messages", "msg-sec");
      break;
    }
    case "rp-merci": {
      const d = S.ui.rpDone; if(!d) return;
      S.ui.tab = "merci"; S.ui.dest = d.nom; render();
      goTab("messages", "msg-sec");
      break;
    }
    case "su-garde": S.ui.su.garde = b.dataset.v; render(); break;
    case "su-eq": S.ui.su.equipe = b.dataset.v; render(); break;
    case "su-travail": S.ui.su.travail = b.dataset.v; render(); break;
    case "su-ok": {
      const su = S.ui.su; if(!su) return;
      if(!su.equipe){ toast("Choisis ton équipe"); return; }
      const parEquipe = su.equipe !== "autre";
      if(!parEquipe && (!su.anc || isNaN(dayNum(su.anc)))){ toast("Indique quand commence ta prochaine garde"); return; }
      const base = clone(DEFAULT_REG), nom = (su.nom || "").trim();

$("#app").addEventListener("change", e => {
  const t = e.target, week = activeWeek();
  if(t.id === "msg-dest"){ S.ui.dest = t.value; render(); return; }
  if(t.id === "bk-file"){
    const f = t.files && t.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => askImport(fr.result);
    fr.onerror = () => toast("Impossible de lire ce fichier");
    fr.readAsText(f);
    return;
  }
  if(t.id === "as-s" || t.id === "as-e"){ updateReste(); return; }
  if(t.id === "pt-s" || t.id === "pt-e"){
    const box = $(".part-box"), info = $("#pt-info"), r0 = (week.remplacements || []).find(x => x.id === S.ui.part);
    if(box && info && r0) info.textContent = partInfo(r0.nom, { s: Number(box.dataset.rs), e: Number(box.dataset.re) }, Number($("#pt-s").value), Number($("#pt-e").value));
    return;
  }

    const d = t.dataset.saisiAutre, sig = t.dataset.sig, day = sig.split("|")[0];
    const all = clone(currentReg().saisiesAutres || {});
    const today = dayNum(nowLocal());
    for(const k of Object.keys(all)) if(dayNum(k) < today - 14) delete all[k];
    const list = (all[d] || []).filter(k => !k.startsWith(day + "|"));
    if(t.checked) list.push(sig);
    all[d] = list;
    saveReg({ saisiesAutres: all }); render(); return;
  }
  if(t.dataset.saisi !== undefined && week){
    const sig = t.dataset.saisi, day = sig.split("|")[0];
    const list = (week.saisies || []).filter(k => !k.startsWith(day + "|"));
    if(t.checked) list.push(sig);
    saveWeek(week.id, { saisies: list });
    return;
  }
  if(t.dataset.rpp !== undefined && S.ui.rp){ const p = S.ui.rp.pieces[Number(t.dataset.rpp)]; if(p) p.on = t.checked; return; }
  if(t.id === "aj-all"){ $("#aj-de").disabled = $("#aj-a").disabled = t.checked; return; }
  if(t.dataset.wf && week){
    const f = t.dataset.wf;
    if(f === "debut" || f === "fin"){ if(t.value) saveWeek(week.id, { [f]: t.value }); return; }
    if(f === "plageOn"){ saveWeek(week.id, { plage: t.checked ? "19:00-07:00" : null }); return; }
    if(f === "plageS" || f === "plageE"){
      const s = ($("#w-ps") || {}).value || "19:00", en = ($("#w-pe") || {}).value || "07:00";
      saveWeek(week.id, { plage: `${s}-${en}` }); return;
    }
  }
  if(t.id === "su-anc"){ if(S.ui.su){ S.ui.su.anc = t.value; render(); } return; }
  if(t.id === "su-sem"){ if(S.ui.su) S.ui.su.sem = t.value; return; }
  if(t.id === "cy-len"){
    const c = clone(currentReg().cycle), L = Math.min(70, Math.max(1, Math.round(Number(t.value) || 7)));
    c.motif = ((c.motif || "") + "R".repeat(70)).slice(0, L); saveReg({ cycle: c }); render(); return;
  }
  if(t.id === "ex-multi"){ S.ui.exMulti = t.checked; render(); return; }
  if(t.id === "ex-fin"){ S.ui.exFin = t.value; return; }
  if(t.id === "ex-de" || t.id === "ex-a"){ S.ui[t.id === "ex-de" ? "exDe" : "exA"] = t.value; render(); return; }
  if(t.id === "bl-year"){ S.ui.year = Number(t.value); render(); return; }
  if(t.id === "g-eq"){
    const v = t.value;
    if(!v){ saveReg({ equipe: "" }); render(); toast("Règle tes plages de garde à la main ci-dessous"); return; }
    const g = gardeEquipe(v);
    saveReg({ equipe: v, garde: g }); recalcWeeks(currentReg());
    const d = prochaineGarde(g);
    if(d && !S.weeks.some(w => w.id === d)) createWeek(d); else { if(d) S.activeId = d; render(); }
    if(d) toast(`Équipe ${v} : prochaine garde le ${fmtDay(dayNum(d) * CPD, true)}`);
    return;
  }
  if(t.dataset.cy !== undefined){
    const c = clone(currentReg().cycle), motif = (c.motif || "RRRRRRR").split("");

  }
  if(t.dataset.hr){

    const c = clone(currentReg().cycle); c.horaires = { ...c.horaires, [k]: `${sv}-${ev}` };
    saveReg({ cycle: c }); render(); return;
  }
  if(t.id === "gf-on" || t.id === "gf-s" || t.id === "gf-e"){

    const g = { ...clone(currentReg().garde), ferie: on ? `${fs}-${fe}` : "" };
    saveReg({ garde: g }); recalcWeeks(currentReg()); render(); return;
  }
  if(t.dataset.gm){
    const [i, f] = t.dataset.gm.split("."), mo = clone(currentReg().garde.modele || []), p = mo[Number(i)];
    if(!p || !t.value) return;
    p[f] = (f === "j" || f === "aj") ? Number(t.value) : t.value;
    const st = p.j * 1440 + hm(p.de), en = () => p.aj * 1440 + hm(p.a);
    if(en() <= st){
      if(f === "j" || f === "de"){ p.aj = Math.min(13, p.j + (hm(p.a) <= hm(p.de) ? 1 : 0)); }
      if(en() <= st){ toast("La fin de la plage doit être après son début"); render(); return; }
    }
    saveModele(mo); return;
  }
  if(t.dataset.rf){
    const path = t.dataset.rf.split("."), reg = clone(currentReg());
    let v = t.type === "checkbox" ? t.checked : (t.type === "number" || t.dataset.num) ? Number(t.value) : t.value.trim();
    if(path[1] === "horaires" && !/^\d{1,2}:\d{2}-\d{1,2}:\d{2}$/.test(v)){ toast("Format attendu : 05:00-13:00"); return; }
    let o = reg; for(let i = 0; i < path.length - 1; i++) o = o[path[i]];
    o[path[path.length - 1]] = v;
    if(t.dataset.rf === "cycle.actif" && v){
      if(!reg.cycle.ancre) reg.cycle.ancre = dayStr(dayNum(nowLocal()));
      if(!reg.cycle.motif) reg.cycle.motif = "RRRRRRR";
    }
    saveReg(reg);
    if(t.dataset.rf === "garde.ferie") recalcWeeks(currentReg());
    if(t.dataset.rf === "garde.ancre" || t.dataset.rf === "garde.semaines") saveReg({ equipe: "" });
    render();
  }
});

$("#app").addEventListener("input", e => {
  const t = e.target;
  if(t.id === "su-nom"){ if(S.ui.su) S.ui.su.nom = t.value; return; }
  if(t.id === "ex-note"){ S.ui.exNote = t.value; return; }
  if(t.id === "rp-txt") S.ui.rpTxt = t.value;
  else if(t.id === "rp-nom") S.ui.rpNom = t.value;
});

/* ---------- Analyse d'une réponse (sur le téléphone) ---------- */
let sampleOk = true, rpCtl = null;
function runAnalyse(week, reg, nom, txt){
  const m = compute(week, reg); if(!m) return;
  S.ui.rpErr = "";
  const r = interpret(parseReply(txt, m), m, nom, txt);
  r.resume = resumeOf(r);
  S.ui.rp = r;
  render();
}

/* ---------- Données (sur le téléphone) ---------- */
const SEED = { reglages: {}, semaines: {} };
const LS_KEY = "remplacements-garde:v1";
const LocalDB = (() => {
  let store, persistent = true, warned = false;
  const fresh = () => ({ reglages: clone(SEED.reglages) || {}, semaines: clone(SEED.semaines) || {} });
  try {
    const raw = localStorage.getItem(LS_KEY);
    store = raw ? JSON.parse(raw) : fresh();
    if(!raw) localStorage.setItem(LS_KEY, JSON.stringify(store));
    const back = localStorage.getItem(LS_KEY);
    if(!back) persistent = false;
  } catch(e){ persistent = false; store = store || fresh(); }
  store.reglages = store.reglages || {}; store.semaines = store.semaines || {};
  const listeners = [];
  function save(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(store)); }
    catch(e){ persistent = false; if(!warned){ warned = true; S.notice = STORAGE_MSG; } }
  }
  const isObj = v => v && typeof v === "object" && !Array.isArray(v);
  function merge(a, b){ for(const k of Object.keys(b)){ if(isObj(b[k]) && isObj(a[k])) merge(a[k], b[k]); else a[k] = clone(b[k]); } }
  const meta = { fromCache: false, hasPendingWrites: false };
  function snapDoc(col, id){ const d = store[col] && store[col][id]; return { id, exists: !!d, data: () => d ? clone(d) : undefined, metadata: meta }; }
  function snapCol(col){ const docs = Object.keys(store[col] || {}).sort().map(id => snapDoc(col, id)); return { docs, size: docs.length, empty: !docs.length, metadata: meta, docChanges: () => [] }; }
  function emit(col, id){ for(const l of [...listeners]){ if(l.col !== col) continue; if(l.kind === "col") l.fn(snapCol(col)); else if(id == null || l.id === id) l.fn(snapDoc(col, id == null ? l.id : id)); } }
  function sub(l){ listeners.push(l); setTimeout(() => l.fn(l.kind === "col" ? snapCol(l.col) : snapDoc(l.col, l.id)), 0); return () => { const i = listeners.indexOf(l); if(i >= 0) listeners.splice(i, 1); }; }
  function docRef(col, id){
    return {
      id, path: col + "/" + id,
      get: async () => snapDoc(col, id),
      set: async data => { (store[col] = store[col] || {})[id] = clone(data); save(); emit(col, id); },
      update: async data => { const cur = store[col] && store[col][id]; if(!cur) throw { code: "invalid_argument", message: "Document absent" }; merge(cur, data); save(); emit(col, id); },
      delete: async () => { if(store[col]) delete store[col][id]; save(); emit(col, id); },
      onSnapshot: fn => sub({ kind: "doc", col, id, fn })
    };
  }
  return {
    doc(path){ const [col, id] = String(path).split("/"); return docRef(col, id); },
    collection(col){ return { path: col, doc: id => docRef(col, id), get: async () => snapCol(col), onSnapshot: fn => sub({ kind: "col", col, fn }) }; },
    exportAll(){ return clone(store); },
    importAll(data){ store = { reglages: clone(data.reglages) || {}, semaines: clone(data.semaines) || {} }; save(); emit("reglages"); emit("semaines"); },
    get persistent(){ return persistent; }
  };
})();
const STORAGE_MSG = "Ce navigateur ne garde pas tes données (navigation privée ?) : elles seront perdues en fermant la page. Ouvre l'appli depuis l'écran d'accueil, ou fais une sauvegarde avant de fermer.";

function backupObj(){ const st = LocalDB.exportAll(); return { app: "remplacements-garde", version: 1, exporteLe: nowLocal(), reglages: st.reglages || {}, semaines: st.semaines || {} }; }
function parseBackup(txt){
  let o; try { o = JSON.parse(String(txt || "").trim()); } catch(e){ return null; }
  if(!o || o.app !== "remplacements-garde" || !o.semaines || typeof o.semaines !== "object" || !o.reglages || typeof o.reglages !== "object") return null;
  return o;
}
function askImport(txt){
  const o = parseBackup(txt);
  if(!o){ toast("Ce n'est pas une sauvegarde de cet outil"); return; }
  const n = Object.keys(o.semaines).length;
  S.ui.bkConfirm = { data: o, resume: `La sauvegarde contient ${n} semaine${n > 1 ? "s" : ""} de garde${o.exporteLe ? `, faite le ${fmtMaj(o.exporteLe)}` : ""}. Tes données actuelles sur ce téléphone seront remplacées.` };
  S.ui.settingsOpen = true; render();
}
function copyText(text, okMsg, onOk){
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(e){}
    ta.remove(); toast(ok ? okMsg : "Copie impossible ici : utilise plutôt « Enregistrer ou envoyer la sauvegarde »");
    if(ok && onOk) onOk();
  };
  try { navigator.clipboard.writeText(text).then(() => { toast(okMsg); if(onOk) onOk(); }, fallback); } catch(e){ fallback(); }
}

(function init(){
  S.db = LocalDB; S.dbResolved = true;
  if(!LocalDB.persistent) S.notice = STORAGE_MSG;
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e){}
  try { if("serviceWorker" in navigator && /^(https:|http:\/\/localhost)/.test(location.href)) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch(e){}
  LocalDB.doc("reglages/general").onSnapshot(snap => { S.reg = snap.exists ? snap.data() : null; requestRender(); });
  LocalDB.collection("semaines").onSnapshot(snap => {
    S.weeks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.weeksLoaded = true; S.confirmed = true;
    requestRender();
  });
})();
render();
})();
