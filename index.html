<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Cagnotte</title>
<meta name="theme-color" content="#1C4C9A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cagnotte">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one-column phone app. Lift-ticket balance card on top, one card per topic, fixed tab bar at the bottom, bottom sheets for entry. */
:root{
  --bg:#ECF0F3;--surface:#FFFFFF;--surface-2:#F3F6F9;--ink:#13212E;--muted:#5A6A79;--line:#D3DCE4;
  --accent:#1C4C9A;--accent-ink:#FFFFFF;--accent-soft:#DFE7F4;--perf:rgba(255,255,255,.45);
  --ok:#1B7044;--ok-soft:#D9EEE1;--late:#BC2F25;--late-soft:#F6DDD9;--due:#9A5800;--due-soft:#F8E8CF;
  --shadow:0 1px 2px rgba(19,33,46,.06),0 6px 18px rgba(19,33,46,.06);
  --dim:rgba(8,14,20,.45);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D151D;--surface:#15202B;--surface-2:#1B2834;--ink:#E4EBF1;--muted:#93A3B2;--line:#2A3A49;
  --accent:#8EB1EC;--accent-ink:#0C1828;--accent-soft:#1D2F4C;--perf:rgba(12,24,40,.4);
  --ok:#6BC891;--ok-soft:#163324;--late:#EF8A80;--late-soft:#3B1E1B;--due:#E6AA52;--due-soft:#382A14;
  --shadow:0 0 0 1px #24323F;--dim:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151D;--surface:#15202B;--surface-2:#1B2834;--ink:#E4EBF1;--muted:#93A3B2;--line:#2A3A49;
  --accent:#8EB1EC;--accent-ink:#0C1828;--accent-soft:#1D2F4C;--perf:rgba(12,24,40,.4);
  --ok:#6BC891;--ok-soft:#163324;--late:#EF8A80;--late-soft:#3B1E1B;--due:#E6AA52;--due-soft:#382A14;
  --shadow:0 0 0 1px #24323F;--dim:rgba(0,0,0,.55);color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
.trip{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:right}
#view{display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.card h2{font-family:var(--f-display);font-size:19px;font-weight:700;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;line-height:1.2}
.card h2 small{font-family:var(--f-body);font-size:12.5px;font-weight:500;color:var(--muted);text-align:right}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.muted{color:var(--muted)}
.neg{color:var(--late)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.warn{background:var(--due-soft);color:var(--due);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:500;margin:10px 0 0}
.sub{margin:-2px 0 8px;font-size:13.5px;color:var(--muted)}

/* lift-ticket balance */
.ticket{background:var(--accent);color:var(--accent-ink);border-radius:16px;position:relative}
.ticket-main{padding:16px 18px 14px}
.ticket .eyebrow{opacity:.85}
.big{font-family:var(--f-display);font-weight:700;font-size:46px;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:4px}
.ticket-sub{font-size:13px;opacity:.9;margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center}
.btn.share{margin-top:12px;width:100%;background:var(--accent-ink);color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:13px}
.card .linkbtn{color:var(--accent)}
.warn .linkbtn{color:inherit}
.ticket-stubs{display:grid;grid-template-columns:1fr 1fr;border-top:2px dashed var(--perf);position:relative}
.ticket-stubs::before,.ticket-stubs::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.ticket-stubs::before{left:-9px}
.ticket-stubs::after{right:-9px}
.stub{padding:11px 18px 14px;min-width:0}
.stub+.stub{border-left:2px dashed var(--perf)}
.stub span{font-size:12.5px;opacity:.85}
.stub b{display:block;font-family:var(--f-display);font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{min-width:0}
.row .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.row.total .l{font-weight:700}
.row.total .r{font-family:var(--f-display);font-size:21px;font-weight:700}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-family:var(--f-body)}
.chip.late{background:var(--late-soft);color:var(--late)}
.chip.due{background:var(--due-soft);color:var(--due)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:42px;text-align:center;text-decoration:none;font-size:15px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--late-soft);color:var(--late)}
.btn.small{min-height:32px;padding:5px 12px;font-size:14px;border-radius:9px}
.btn.block{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.actions .btn{flex:1 1 auto}
.toprow{display:flex;gap:8px;flex-wrap:wrap}
.toprow .btn{flex:1 1 140px}

/* payment grid */
.gridwrap{overflow-x:auto;margin:0 -8px;padding:0 8px}
table.grid{border-collapse:separate;border-spacing:3px;width:100%;font-variant-numeric:tabular-nums}
.grid th{font-weight:600;font-size:12px;color:var(--muted);padding:2px 0 3px;text-align:center;white-space:nowrap}
.grid td{padding:0}
.grid .m{text-align:left;font-weight:600;font-size:13px;white-space:nowrap;padding-right:4px;color:var(--ink)}
.grid .m.now{color:var(--accent)}
.cell{display:flex;align-items:center;justify-content:center;width:100%;min-width:42px;height:36px;border:0;border-radius:7px;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.cell.paid{background:var(--ok-soft);color:var(--ok)}
.cell.late{background:var(--late-soft);color:var(--late);box-shadow:inset 0 0 0 1.5px var(--late)}
.cell.due{background:var(--due-soft);color:var(--due);box-shadow:inset 0 0 0 1.5px var(--due)}
.cell.future{background:var(--surface-2);color:var(--muted);font-weight:500}
.cell.off{background:transparent;color:var(--line);cursor:default}
.grid tfoot td{font-size:12px;color:var(--muted);text-align:center;padding-top:5px;font-weight:600}
.grid tfoot td.m{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.k-paid{background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.k-due{background:var(--due-soft);box-shadow:inset 0 0 0 1.5px var(--due)}
.k-late{background:var(--late-soft);box-shadow:inset 0 0 0 1.5px var(--late)}
.k-future{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.k-spent{background:var(--ok)}
.k-rem{background:var(--accent)}

/* projects */
.projtabs{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:0 -2px;scrollbar-width:none}
.projtabs::-webkit-scrollbar{display:none}
.ptab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 13px;text-align:left;min-height:54px;color:var(--ink)}
.ptab b{display:block;font-size:15px;font-weight:700}
.ptab span{font-size:12px;color:var(--muted);font-weight:500}
.ptab[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft)}
.ptab.add{border-style:dashed;color:var(--accent);font-weight:600;display:flex;align-items:center}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin:6px 0 8px;box-shadow:inset 0 0 0 1px var(--line)}
.stack i{display:block;height:100%}
.s-paid{background:var(--ok)}
.s-rem{background:var(--accent)}
.exp{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.exp-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:12px 0;border-radius:0;color:var(--ink)}
.exp-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.exp-name{font-weight:600;font-size:15.5px;min-width:0}
.exp-amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.exp-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:3px;font-size:13px}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:7px;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 14px}
.kpis div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.kpis span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpis b{display:block;font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.field label,.flabel{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select{font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-height:44px;width:100%;min-width:0}
.field input:disabled{opacity:.7}
.field textarea{font:inherit;font-size:16px;line-height:1.45;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);width:100%;min-width:0;resize:vertical}
.btns{display:flex;gap:6px}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;min-height:38px;color:var(--ink)}
.pick button.late{border-color:var(--late);color:var(--late)}
.pick button.due{border-color:var(--due);color:var(--due)}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sug{margin:-4px 0 14px}
.sug button{font-size:13px;min-height:32px;padding:4px 11px;font-weight:500}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);border-radius:11px;padding:4px;margin-bottom:12px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 6px;font-weight:600;font-size:14px;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.person{border-top:1px solid var(--line);padding:12px 0 2px}
.person:first-of-type{border-top:0}
.checks{display:flex;gap:6px 18px;flex-wrap:wrap;margin:-2px 0 12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.x{border:0;background:var(--surface-2);color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.backdrop{position:fixed;inset:0;background:var(--dim);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;max-height:88%;overflow:auto;overscroll-behavior:contain;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .22s ease}
.sheet.open{transform:none}
.sheet-head{position:sticky;top:0;background:var(--surface);padding:8px 0 4px;z-index:1;display:flex;justify-content:center}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin-top:2px}
.close{position:absolute;right:0;top:6px;border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;color:var(--muted)}
.sheet h3{font-family:var(--f-display);font-size:23px;margin:0 40px 4px 0;line-height:1.15}
.sheet h4{font-family:var(--f-display);font-size:17px;margin:16px 0 2px}
.sheet .lead{font-size:13.5px;color:var(--muted);margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
@media (max-width:360px){.big{font-size:40px}.stub b{font-size:22px}.kpis b{font-size:17px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>La Cagnotte</h1>
    <span class="trip" id="trip"></span>
  </header>
  <main id="view" aria-live="polite">
    <section class="card"><h2>Chargement de la cagnotte…</h2><p class="note">Versements, voyages et solde du livret arrivent.</p></section>
  </main>
</div>

<nav class="tabs" aria-label="Sections">
  <a href="#accueil" data-route="accueil"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 4l8.5 6.5V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>Accueil</a>
  <a href="#versements" data-route="versements"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M3.5 15h17M9.5 4v16M15 4v16"/></svg>Versements</a>
  <a href="#voyages" data-route="voyages"><svg viewBox="0 0 24 24"><rect x="3.5" y="7.5" width="17" height="12.5" rx="2"/><path d="M9 7.5V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5v2M3.5 12.5h17"/></svg>Voyages</a>
  <a href="#reglages" data-route="reglages"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>Réglages</a>
</nav>

<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Saisie" hidden>
  <div class="sheet-head"><div class="grip"></div><button class="close" id="sheet-close" aria-label="Fermer">×</button></div>
  <div id="sheet-body"></div>
</section>
<div class="toast" id="toast" role="status" hidden></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const view=$('#view'),sheetEl=$('#sheet'),sheetBody=$('#sheet-body'),backdrop=$('#backdrop'),toastEl=$('#toast'),tripEl=$('#trip');
const ROUTES=['accueil','versements','voyages','reglages'];
const S={people:{},payments:{},expenses:{},projects:{},extras:{},moves:{},settings:null,ready:{p:false,pay:false,e:false,pr:false,x:false,m:false,s:false},db:null,canWrite:true,status:'loading',sel:null,showAll:false,delArm:null};
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MOIS_C=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const SUGGEST=['Villa','Location véhicule','Gazole','Péages','Courses et restos','Activités','Billets d’avion','Hôtel'];
const pad=n=>String(n).padStart(2,'0');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const r2=n=>Math.round((+n||0)*100)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf2=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const eur=n=>{n=r2(n);return Number.isInteger(n)?nf0.format(n):nf2.format(n)};
const fmtN=n=>{n=r2(n);return Number.isInteger(n)?String(n):n.toFixed(2).replace('.',',')};
const num=v=>{if(v===''||v==null)return null;const x=parseFloat(String(v).replace(/[\s €]/g,'').replace(',','.'));return Number.isFinite(x)?x:null};
const W=()=>!!S.db&&S.canWrite;
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function localDate(iso){const d=new Date(iso);return isNaN(d)?todayStr():`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function addMonth(m,k=1){let [y,mm]=m.split('-').map(Number);mm+=k;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return `${y}-${pad(mm)}`}
function monthsBetween(a,b){const r=[];if(!a||!b)return r;let m=a;for(let i=0;i<240&&m<=b;i++){r.push(m);m=addMonth(m)}return r}
function mLabel(m,short){if(!m)return '';const [y,mm]=m.split('-');const n=(short?MOIS_C:MOIS)[+mm-1]||'';const base=(S.settings&&S.settings.startMonth||'').slice(0,4);return cap(n)+(base&&y!==base?' '+y.slice(2):'')}
function mYear(m){if(!m)return '';const [y,mm]=m.split('-');return cap(MOIS[+mm-1]||'')+' '+y}
function fmtDate(s){if(!s)return '';const [y,m,d]=s.split('-').map(Number);return `${d} ${MOIS_C[m-1]}${String(y)!==todayStr().slice(0,4)?' '+y:''}`}
function fmtDateTime(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';return `le ${d.getDate()} ${MOIS_C[d.getMonth()]} à ${pad(d.getHours())}:${pad(d.getMinutes())}`}
const payKey=(pid,m)=>pid+'_'+m;
const sumPay=e=>(e.payments||[]).reduce((s,x)=>s+(+x.amount||0),0);
const byOrder=(a,b)=>(a.order??99)-(b.order??99);
function sortedPeople(){return Object.values(S.people).sort((a,b)=>byOrder(a,b)||String(a.name).localeCompare(String(b.name),'fr'))}
function sortedExpenses(){return Object.values(S.expenses).sort((a,b)=>byOrder(a,b)||String(a.label).localeCompare(String(b.label),'fr'))}
function sortedProjects(){return Object.values(S.projects).sort((a,b)=>String(a.month||'9999-99').localeCompare(String(b.month||'9999-99'))||byOrder(a,b))}
function expProject(e){if(e.project&&S.projects[e.project])return e.project;const f=sortedProjects()[0];return f?f.id:null}
function projEnd(pr){return pr.endDate||(pr.month?pr.month+'-31':null)}
function projDate(pr){if(pr.startDate&&pr.endDate)return `du ${fmtDate(pr.startDate)} au ${fmtDate(pr.endDate)}`;if(pr.endDate&&pr.month)return mYear(pr.month)+' · fin le '+fmtDate(pr.endDate);if(pr.month)return mYear(pr.month);if(pr.endDate)return 'fin le '+fmtDate(pr.endDate);return 'Date à fixer'}
function slug(s){return (String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'p')+'-'+Date.now().toString(36).slice(-4)}
const row=(l,r,cls)=>`<div class="row ${cls||''}"><div class="l">${l}</div><div class="r">${r}</div></div>`;
/* Après la dernière échéance du crédit, la part crédit de chacun part aux voyages. */
/* Une cotisation peut changer à partir d'un mois (p.rates). */
function sortRates(p){return [...(p.rates||[])].sort((a,b)=>String(a.from).localeCompare(String(b.from)))}
function rateFor(p,m){let r={monthly:+p.monthly||0,ski:+p.ski||0,credit:+p.credit||0};for(const x of sortRates(p))if(m>=x.from)r={monthly:+x.monthly||0,ski:+x.ski||0,credit:+x.credit||0};return r}
function shareFor(p,m){const ce=S.settings.creditEndMonth;const after=!!(ce&&m>ce);const r=rateFor(p,m);return {ski:r.ski+(after?r.credit:0),credit:after?0:r.credit}}
function splitFor(p,m,amount){const sh=shareFor(p,m),tot=sh.ski+sh.credit;if(!tot)return {ski:r2(amount),credit:0};return {ski:r2(amount*sh.ski/tot),credit:r2(amount*sh.credit/tot)}}
function inPeriod(p,m,start){return m>=(p.fromMonth||start)&&(!p.untilMonth||m<=p.untilMonth)}

function creditDates(fromExcl,toIncl){
  const st=S.settings,out=[];
  if(!fromExcl||!toIncl||toIncl<=fromExcl)return out;
  const day=Math.min(Math.max(parseInt(st.creditDay,10)||1,1),28);
  let m=fromExcl.slice(0,7);
  for(let i=0;i<240;i++){const d=`${m}-${pad(day)}`;if(d>toIncl)break;if(d>fromExcl&&(!st.creditEndMonth||m<=st.creditEndMonth))out.push(d);m=addMonth(m)}
  return out;
}

/* ---------- money model ----------
   Livret = versements + virements exceptionnels − dépenses des voyages − prélèvements du crédit.
   Pot voyages = parts voyages + virements exceptionnels « voyages » − toutes les dépenses des voyages.
   Les voyages se suivent par date : ce qui reste d'un voyage passe au suivant. */
function calc(){
  const st=S.settings,today=todayStr(),cm=today.slice(0,7);
  const start=st.startMonth||cm;
  const gridEnd=[st.endMonth||cm,addMonth(cm,2)].sort().pop();
  const months=monthsBetween(start,gridEnd);
  const active=sortedPeople().filter(p=>p.active!==false);
  const anchorAt=st.anchorAt||'';
  const anchorDay=anchorAt?localDate(anchorAt):'';
  const isNew=x=>{if(!anchorAt)return true;const d=x.date||'';return d>anchorDay||(d===anchorDay&&(x.recordedAt||'')>anchorAt)};
  const cmo=+st.creditMonthly||0;
  let vIn=0,vOut=0,newIn=0,newOut=0;
  for(const p of Object.values(S.payments)){vIn+=+p.ski||0;if(isNew(p))newIn+=+p.amount||0}
  for(const x of Object.values(S.extras)){if(x.target!=='credit')vIn+=+x.amount||0;if(isNew(x))newIn+=+x.amount||0}
  for(const e of Object.values(S.expenses))for(const x of e.payments||[]){vOut+=+x.amount||0;if(isNew(x))newOut+=+x.amount||0}
  for(const x of Object.values(S.moves)){
    const a=+x.amount||0;
    if(x.dir==='transfer'){vIn+=a;continue}
    const sgn=x.dir==='in'?1:-1;
    if(isNew(x)){if(sgn>0)newIn+=a;else newOut+=a}
    if(x.target==='voyages')vIn+=sgn*a;
  }
  const creditPast=anchorDay?creditDates(anchorDay,today).length:0;
  const est=r2((+st.anchorBalance||0)+newIn-newOut-cmo*creditPast);
  const pot=r2(vIn-vOut),reserve=r2(est-pot);
  const unpaid=(p,m)=>inPeriod(p,m,start)&&!S.payments[payKey(p.id,m)];
  const owe={};
  for(const p of active)for(const m of months){
    if(m>cm||!unpaid(p,m))continue;
    const o=owe[p.id]||(owe[p.id]={p,late:[],due:[],total:0});
    (m<cm?o.late:o.due).push(m);o.total+=rateFor(p,m).monthly;
  }
  const voyageRate=m=>active.reduce((s,p)=>s+(inPeriod(p,m,start)?shareFor(p,m).ski:0),0);
  const voyagersAt=m=>active.filter(p=>inPeriod(p,m,start)&&shareFor(p,m).ski>0);
  const cEnd=st.creditEndMonth||null;
  const remainingCredit=cmo&&cEnd?creditDates(today,cEnd+'-31').length:0;
  const creditDone=!!(cmo&&cEnd&&remainingCredit===0);
  let surplus=null,surplusTo=null;
  if(cmo&&cEnd&&!creditDone){let ec=0;for(const m of monthsBetween(start,cEnd))for(const p of active)if(unpaid(p,m))ec+=shareFor(p,m).credit;surplus=r2(reserve+ec-cmo*remainingCredit)}
  const proj={},order=[];let carry=pot,prevMonth=null,prev=null,current=null;
  for(const pr of sortedProjects()){
    const exps=sortedExpenses().filter(e=>expProject(e)===pr.id);
    let paid=0,planned=0,remaining=0;const unest=[],rest=[];
    for(const e of exps){
      const pd=sumPay(e);paid+=pd;
      if(e.rest){rest.push(e);planned+=pd}
      else if(e.closed){planned+=pd}
      else if(e.planned==null){unest.push(e);planned+=pd}
      else{planned+=Math.max(+e.planned,pd);remaining+=Math.max(+e.planned-pd,0)}
    }
    const end=projEnd(pr);
    const x={pr,exps,paid:r2(paid),planned:r2(planned),remaining:r2(remaining),unest,rest,end,passed:!!(end&&today>end),prev:null,next:null};
    proj[pr.id]=x;order.push(pr.id);
    if(x.passed)continue;
    let expected=0;const fromM=prevMonth?addMonth(prevMonth):start;
    if(pr.month)for(const m of monthsBetween(fromM,pr.month))for(const p of active)if(unpaid(p,m))expected+=shareFor(p,m).ski;
    let cs=0;if(surplus>0&&!surplusTo&&(!pr.month||pr.month>cEnd)){cs=surplus;surplusTo=pr.name}
    x.isFirst=!current;x.fromM=fromM;x.start=r2(carry);x.expected=r2(expected);x.creditSurplus=cs;x.available=r2(carry+expected+cs-remaining);
    x.prev=prev;if(prev)prev.next=x;
    if(!current)current=pr.id;
    carry=x.available;if(pr.month)prevMonth=pr.month;prev=x;
  }
  let horizon=(current&&proj[current].pr.month)||addMonth(cm,1);
  if(cEnd&&!creditDone&&horizon>cEnd)horizon=cEnd;
  let expCr=0;for(const m of monthsBetween(start,horizon))for(const p of active)if(unpaid(p,m))expCr+=shareFor(p,m).credit;
  const reserveEnd=r2(reserve+expCr-cmo*creditDates(today,horizon+'-31').length);
  const nextCredit=cmo&&!creditDone?(creditDates(today,addMonth(cm,36)+'-31')[0]||null):null;
  const monthlyCrIn=active.reduce((s,p)=>s+(inPeriod(p,cm,start)?shareFor(p,cm).credit:0),0);
  return {today,cm,start,months,est,pot,reserve,owe,proj,order,current,horizon,reserveEnd,nextCredit,monthlyCrIn,voyageRate,voyagersAt,vIn,vOut,cEnd,remainingCredit,creditDone,surplus,surplusTo,capital:r2(cmo*remainingCredit)};
}

function stateCard(t,txt,btn){return `<section class="card"><h2>${t}</h2><p class="note">${txt}</p>${btn||''}</section>`}
function statusChip(x){return x.passed?'<span class="chip">Terminé</span>':x.isFirst?'<span class="chip ok">En cours</span>':'<span class="chip">À venir</span>'}
const restNames=x=>x.rest.map(e=>esc(e.label).toLowerCase()).join(', ');

function dayBudget(x){
  const pr=x.pr;if(!x.rest.length)return '';
  if(!pr.startDate||!pr.endDate)return x.isFirst?`<p class="note">Ajoute les dates du séjour au projet pour voir le budget par jour pour ${restNames(x)}.</p>`:'';
  const t=todayStr(),from=t>pr.startDate?t:pr.startDate;
  if(from>pr.endDate||x.available<=0)return '';
  const days=Math.round((new Date(pr.endDate+'T12:00:00')-new Date(from+'T12:00:00'))/864e5)+1;
  const during=t>=pr.startDate;
  return `<p class="warn" style="background:var(--ok-soft);color:var(--ok)"><b>${eur(x.available/days)} par jour</b> pour ${restNames(x)}, sur ${days} jour${days>1?'s':''}${during?' restant'+(days>1?'s':''):' de séjour'}.</p>`;
}
function creditCard(c,hz){
  const st=S.settings;
  if(c.creditDone)return `<section class="card">
  <h2>Crédit <span class="chip ok">Remboursé</span></h2>
  <div class="rows">${row('Réserve restante',`<span class="${c.reserve<0?'neg':''}">${eur(c.reserve)}</span>`)}</div>
  ${c.reserve>0&&W()?`<div class="actions" style="margin-top:8px"><button class="btn block" data-act="credit-transfer">Basculer ${eur(c.reserve)} vers les voyages</button></div>`:''}
  <p class="note">Les parts crédit de chacun vont maintenant aux voyages.</p>
</section>`;
  const rows=[row('Prochain prélèvement',c.nextCredit?eur(st.creditMonthly)+' · '+fmtDate(c.nextCredit):'Aucun')];
  if(c.cEnd){
    rows.push(row(`Dernière mensualité<div class="note">${c.remainingCredit} prélèvement${c.remainingCredit>1?'s':''} restant${c.remainingCredit>1?'s':''}</div>`,mYear(c.cEnd)));
    rows.push(row('Reste à rembourser',eur(c.capital)));
  }
  rows.push(row('Part crédit versée chaque mois',eur(c.monthlyCrIn)));
  if(c.cEnd&&c.surplus!=null)rows.push(`<div class="row total"><div class="l">Réserve à la fin du crédit<div class="note">si tout le monde paie</div></div><div class="r ${c.surplus<0?'neg':''}">${eur(c.surplus)}</div></div>`);
  else rows.push(`<div class="row total"><div class="l">Réserve crédit fin ${hz}<div class="note">si tout le monde paie</div></div><div class="r ${c.reserveEnd<0?'neg':''}">${eur(c.reserveEnd)}</div></div>`);
  let more='';
  if(c.surplus>0)more+=`<p class="note">Ce surplus ira aux voyages${c.surplusTo?` : il est déjà compté dans le budget de <b>${esc(c.surplusTo)}</b>`:''}. Après ${mYear(c.cEnd).toLowerCase()}, les parts crédit basculent vers les voyages.</p>`;
  if(c.surplus!=null&&c.surplus<0)more+=`<p class="warn">La réserve ne suffira pas : il manquera ${eur(-c.surplus)}.${W()?' <button class="linkbtn" data-act="extra-new">Faire un virement exceptionnel</button>':''}</p>`;
  if(!c.cEnd)more+=`<p class="note">Indique la dernière échéance dans Réglages pour voir la fin du crédit.</p>`;
  return `<section class="card"><h2>Crédit</h2><div class="rows">${rows.join('')}</div>${more}<p class="note">La réserve crédit, c’est le livret moins le pot voyages.</p></section>`;
}
function budgetBlock(c,x){
  const pr=x.pr;
  if(x.passed)return `<div class="rows">${row('Dépensé pour ce voyage',eur(x.paid))}</div><p class="note">Voyage terminé : ce qui restait est passé au projet suivant.</p>`;
  const rows=[];
  if(x.isFirst)rows.push(row('Dans la cagnotte voyages aujourd’hui',eur(x.start)));
  else rows.push(row(`Report de ${esc(x.prev.pr.name)}${x.prev.rest.length?`<div class="note">au maximum, selon ce qui partira en ${restNames(x.prev)}</div>`:''}`,eur(x.start)));
  if(pr.month)rows.push(row(`Versements voyages attendus d’ici ${MOIS[+pr.month.slice(5)-1]} ${pr.month.slice(0,4)}`,'+ '+eur(x.expected)));
  if(x.creditSurplus>0)rows.push(row(`Surplus du crédit<div class="note">ce qui restera dans la réserve après la dernière mensualité</div>`,'+ '+eur(x.creditSurplus)));
  rows.push(row('Reste à payer sur les dépenses','− '+eur(x.remaining)));
  const lbl=x.rest.length?'Reste pour '+restNames(x):'Marge';
  const cond=(x.expected>0||!x.isFirst)?'<div class="note">si tout le monde paie</div>':'';
  rows.push(`<div class="row total"><div class="l">${lbl}${cond}</div><div class="r ${x.available<0?'neg':''}">${eur(x.available)}</div></div>`);
  let more=dayBudget(x);
  if(!pr.month){
    const ce=S.settings.creditEndMonth,r1=c.voyageRate(x.fromM||c.cm),r2v=ce&&ce>=(x.fromM||c.cm)?c.voyageRate(addMonth(ce)):null;
    more+=`<p class="note">Indique le mois du voyage pour compter les versements à venir : chaque mois ajoute ${eur(r1)}${r2v!=null&&r2v!==r1?`, puis ${eur(r2v)} après la fin du crédit`:''}.</p>`;
  }
  if(x.available<0)more+=`<p class="warn">Il manque ${eur(-x.available)} pour ce voyage.${W()?` <button class="linkbtn" data-act="extra-new">Faire un virement exceptionnel</button>`:''}</p>`;
  if(x.unest.length)more+=`<p class="warn">Sans montant prévu : ${x.unest.map(e=>esc(e.label).toLowerCase()).join(', ')}.</p>`;
  if(x.next)more+=`<p class="note">Ce qui restera passera à <b>${esc(x.next.pr.name)}</b> ${pr.endDate?'après le '+fmtDate(pr.endDate):pr.month?'après '+MOIS[+pr.month.slice(5)-1]+' '+pr.month.slice(0,4):'une fois ce voyage passé'}.</p>`;
  return `<div class="rows">${rows.join('')}</div>${more}`;
}

  const st=S.settings,people=sortedPeople().filter(p=>p.active!==false),cm=c.cm;
  const winStart=S.showAll?c.start:[c.start,addMonth(cm,-5)].sort().pop();
  const shown=c.months.filter(m=>m>=winStart),hidden=c.months.length-shown.length;
  const dueNow=people.filter(p=>inPeriod(p,cm,c.start));
  const paidNow=dueNow.filter(p=>S.payments[payKey(p.id,cm)]).length;
  const cell=(p,m)=>{
    if(!inPeriod(p,m,c.start))return `<td><span class="cell off">·</span></td>`;
    const pay=S.payments[payKey(p.id,m)];
    let cls,txt,lab;
    const due=fmtN(rateFor(p,m).monthly);
    if(pay){cls='paid';txt=fmtN(pay.amount);lab='payé'}
    else if(m<cm){cls='late';txt=due;lab='en retard'}
    else if(m===cm){cls='due';txt=due;lab='à payer ce mois'}
    else{cls='future';txt=due;lab='à venir'}
    return `<td><button class="cell ${cls}" data-act="cell" data-p="${esc(p.id)}" data-m="${m}" aria-label="${esc(p.name)}, ${mLabel(m)} : ${lab}">${txt}</button></td>`;
  };
  const totals=people.map(p=>Object.values(S.payments).filter(x=>x.person===p.id).reduce((s,x)=>s+(+x.amount||0),0));
  const recent=Object.values(S.payments).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.recordedAt).localeCompare(String(a.recordedAt))).slice(0,10);
  const extras=Object.values(S.extras).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const exTotal=extras.reduce((s,x)=>s+(+x.amount||0),0);
  const who=x=>x.person&&S.people[x.person]?S.people[x.person].name:'Plusieurs / autre';
  const moves=Object.values(S.moves).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const moveSide=x=>x.dir==='transfer'?'réserve crédit → voyages':x.target==='voyages'?'compte pour les voyages':'compte pour la réserve crédit';
  return `
${W()?`<div class="toprow"><button class="btn" data-act="pay-new">Noter un versement</button><button class="btn ghost" data-act="extra-new">Virement exceptionnel</button></div>`:''}
<section class="card">

  ${hidden?`<button class="linkbtn" data-act="show-all" style="margin-bottom:6px">Voir les ${hidden} mois d’avant</button>`:S.showAll&&c.start<addMonth(cm,-5)?`<button class="linkbtn" data-act="show-all" style="margin-bottom:6px">Masquer les anciens mois</button>`:''}

</section>

function expRow(e,x){
  const paid=sumPay(e),id=esc(e.id);
  let right,chip,meta='',pct=null;
  if(e.rest){
    right=x.passed?eur(paid):`<span class="${x.available<0?'neg':''}">${eur(x.available)}</span> dispo`;
    chip='<span class="chip ok">Le reste du pot</span>';meta=paid?`dépensé ${eur(paid)}`:'rien dépensé pour l’instant';
  }else if(e.closed){right=eur(paid);chip='<span class="chip ok">Soldé</span>';pct=100}
  else if(e.planned==null){right='à estimer';chip='<span class="chip due">Sans montant</span>';meta=paid?`payé ${eur(paid)}`:''}
  else{
    const rem=Math.max(+e.planned-paid,0);right=eur(e.planned);
    chip=paid>0?'<span class="chip">Acompte versé</span>':'<span class="chip">À payer</span>';
    meta=`payé ${eur(paid)} · reste ${eur(rem)}`;pct=+e.planned>0?Math.min(paid/(+e.planned)*100,100):0;
  }
  const canPay=W()&&!e.closed&&!x.passed;
  return `<div class="exp"><button class="exp-main" data-act="exp" data-e="${id}"><div class="exp-top"><span class="exp-name">${esc(e.label)}</span><span class="exp-amt">${right}</span></div><div class="exp-meta">${chip}${meta?`<span class="muted">${meta}</span>`:''}</div>${pct!=null?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}</button>${canPay?`<button class="btn small ghost" data-act="exp-pay" data-e="${id}">${e.rest?'+ Dépense':'Payer'}</button>`:''}</div>`;
}

function selProject(c){return (S.sel&&c.proj[S.sel])?S.sel:(c.current||c.order[0]||null)}
function vTrips(c){
  if(!c.order.length)return stateCard('Aucun projet','Crée un premier voyage pour suivre son budget.',W()?`<div class="actions" style="margin-top:10px"><button class="btn block" data-act="proj-new">Créer un projet</button></div>`:'');
  const sid=selProject(c),x=c.proj[sid],pr=x.pr;
  const tabs=c.order.map(id=>{const y=c.proj[id];return `<button class="ptab" data-act="proj-sel" data-id="${esc(id)}" aria-pressed="${id===sid}"><b>${esc(y.pr.name)}</b><span>${y.passed?'Terminé':esc(projDate(y.pr))}</span></button>`}).join('')+(W()?`<button class="ptab add" data-act="proj-new">+ Projet</button>`:'');
  const base=Math.max(x.paid+x.remaining+Math.max(x.available||0,0),1);
  const wP=Math.min(x.paid/base*100,100),wR=Math.min(x.remaining/base*100,100-wP);
  const vs=c.voyagersAt(pr.month||'9999-12');
  const per=vs.length?x.planned/vs.length:0;
  return `
<div class="projtabs" role="group" aria-label="Projets">${tabs}</div>
<section class="card">
  <h2>${esc(pr.name)} ${statusChip(x)}</h2>
  <p class="sub">${esc(projDate(pr))}${pr.note?' · '+esc(pr.note):''}${W()?` · <button class="linkbtn" data-act="proj-edit" data-id="${esc(sid)}">Modifier</button>`:''}</p>
  ${x.passed?'':`<div class="stack" role="img" aria-label="Payé ${eur(x.paid)}, reste à payer ${eur(x.remaining)}"><i class="s-paid" style="width:${wP}%"></i><i class="s-rem" style="width:${wR}%"></i></div>
  <div class="legend" style="margin:0 0 6px"><span><i class="k-spent"></i>Payé ${eur(x.paid)}</span><span><i class="k-rem"></i>Reste à payer ${eur(x.remaining)}</span><span><i class="k-future"></i>Libre</span></div>`}
  ${budgetBlock(c,x)}
  ${x.planned>0&&vs.length?`<p class="note">Dépenses prévues : ${eur(x.planned)}${x.rest.length?' hors '+restNames(x):''}, soit ${eur(per)} par cotisant voyages.</p>`:''}
</section>
<section class="card">
  <h2>Dépenses <small>${x.exps.length?x.exps.length+' ligne'+(x.exps.length>1?'s':''):''}</small></h2>
  ${x.exps.length?`<div>${x.exps.map(e=>expRow(e,x)).join('')}</div>`:`<p class="note">Aucune dépense pour ce voyage. Ajoute la première : logement, transport, activités…</p>`}
  ${W()&&!x.passed?`<div class="actions" style="margin-top:10px"><button class="btn block" data-act="exp-new" data-id="${esc(sid)}">Ajouter une dépense</button></div>`:''}
</section>`;
}

/* ---------- render ---------- */
let pendingRender=false;
const isTyping=root=>{const a=document.activeElement;return !!(a&&root.contains(a)&&a.matches&&a.matches('input,select,textarea'))};
function route(){const h=(location.hash||'').slice(1);if(h==='ski')return 'voyages';return ROUTES.includes(h)?h:'accueil'}
function allReady(){return Object.values(S.ready).every(Boolean)}
function render(){
  if(isTyping(view)){pendingRender=true;return}
  pendingRender=false;
  const r=route();
  document.querySelectorAll('.tabs a').forEach(a=>{if(a.dataset.route===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  tripEl.textContent='';
  if(S.status==='nodb'){view.innerHTML=stateCard('Données indisponibles ici','La cagnotte s’ouvre depuis Claude, connecté à ton compte. Dans cette vue, ses données ne peuvent pas être chargées.');return}
  if(S.status==='error'){view.innerHTML=stateCard('La cagnotte ne répond plus','Recharge la page. Si ça persiste, vérifie que tu as toujours accès à cette page.');return}
  if(!allReady()){view.innerHTML=S.status==='slow'?stateCard('La cagnotte ne répond pas encore','Vérifie ta connexion. Les chiffres s’afficheront dès qu’elle répond.'):stateCard('Chargement de la cagnotte…','Versements, voyages et solde du livret arrivent.');return}
  if(!S.settings){view.innerHTML=stateCard('Bienvenue dans La Cagnotte','Importe ton fichier de données (cagnotte-donnees.json) ou une sauvegarde. Tu peux aussi commencer une cagnotte vide.',`<div class="actions" style="margin-top:10px"><button class="btn block" data-act="import">Importer mes données</button><button class="btn ghost block" data-act="init">Commencer à zéro</button></div>`);return}
  const c=calc();
  const cur=c.current&&c.proj[c.current];
  if(cur)tripEl.textContent=cur.pr.name+(cur.pr.month?' · '+MOIS_C[+cur.pr.month.slice(5)-1]+' '+cur.pr.month.slice(2,4):'');
  view.innerHTML=r==='versements'?vPay(c):r==='voyages'?vTrips(c):r==='reglages'?vSet(c):vHome(c);
}
function refresh(){render();if(sheetState&&sheetState.live&&!isTyping(sheetEl))drawSheet()}
view.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{if(!isTyping(view))render()},0)});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ---------- toast & writes ---------- */
let tt;
function toast(msg){toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{toastEl.hidden=true},2400)}
async function w(fn,okMsg){
  if(!W()){toast('Lecture seule : tu ne peux pas modifier la cagnotte');return false}
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){
    console.error(e);
    const code=e&&e.code;
    toast(code==='invalid_argument'?'Modification refusée':code==='quota_exceeded'?'Cagnotte pleine : supprime d’anciennes lignes':'Pas enregistré, réessaie');
    if(code==='invalid_argument'&&S.db){S.canWrite=false;refresh()}
    return false;
  }
}
async function recordPayments(pid,months,each,date,note){
  const p=S.people[pid];const at=new Date().toISOString();
  for(const m of months){
    const amt=each==null?rateFor(p,m).monthly:each;
    const sp=splitFor(p,m,amt);
    await S.db.doc('payments/'+payKey(pid,m)).set({person:pid,month:m,amount:r2(amt),ski:sp.ski,credit:sp.credit,date,note:note||'',recordedAt:at});
  }
}

/* ---------- sheets ---------- */
let sheetState=null;
function openSheet(st){const wasOpen=!!sheetState;sheetState=st;drawSheet();sheetEl.hidden=false;backdrop.hidden=false;sheetEl.scrollTop=0;if(!wasOpen)requestAnimationFrame(()=>requestAnimationFrame(()=>sheetEl.classList.add('open')))}
function drawSheet(){if(!sheetState)return;sheetBody.innerHTML=sheetState.render();if(sheetState.bind)sheetState.bind(sheetBody)}
function closeSheet(){sheetState=null;sheetEl.classList.remove('open');backdrop.hidden=true;setTimeout(()=>{if(!sheetState){sheetEl.hidden=true;sheetBody.innerHTML=''}},240)}
backdrop.addEventListener('click',closeSheet);
$('#sheet-close').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetState)closeSheet()});
sheetBody.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!sheetState||!sheetState.act)return;const fn=sheetState.act[b.dataset.act];if(fn){e.preventDefault();fn(b)}});
function bindInputs(root,map,obj){Object.keys(map).forEach(id=>{const el=root.querySelector('#'+id);if(!el)return;el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT'?'change':'input',ev=>{obj[map[id]]=el.type==='checkbox'?el.checked:ev.target.value})})}
const seg=(act,cur,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>`;

function unpaidMonths(pid){
  const st=S.settings,p=S.people[pid];if(!p)return [];
  const cm=todayStr().slice(0,7);const end=[st.endMonth||cm,addMonth(cm,2)].sort().pop();
  return monthsBetween(st.startMonth,end).filter(m=>inPeriod(p,m,st.startMonth)&&!S.payments[payKey(pid,m)]);
}
function sheetPay(o={}){
  const people=sortedPeople().filter(p=>p.active!==false);
  if(!people.length){toast('Ajoute d’abord un cotisant');return}
  const c=calc();const firstOwe=Object.values(c.owe)[0];
  let pid=o.pid||(firstOwe&&firstOwe.p.id)||people[0].id;
  let sel=new Set(o.months||[]);
  if(!o.months){const u=unpaidMonths(pid);if(u[0])sel.add(u[0])}
  let date=todayStr(),note='',amount=null;
  const rateM=m=>rateFor(S.people[pid]||{},m).monthly;
  const each=()=>amount!=null?amount:rateM([...sel].sort()[0]||todayStr().slice(0,7));
  const total=()=>amount!=null?amount*sel.size:[...sel].reduce((s,m)=>s+rateM(m),0);
  const mixed=()=>amount==null&&new Set([...sel].map(rateM)).size>1;
  openSheet({live:true,
    render(){
      const p=S.people[pid],u=unpaidMonths(pid),cm=todayStr().slice(0,7);
      [...sel].forEach(m=>{if(!u.includes(m))sel.delete(m)});
      return `<h3>Noter un versement</h3><p class="lead">Le versement mensuel de 150 € d’un cotisant.</p>
      <div class="field"><label for="sp-p">Qui a payé ?</label><select id="sp-p">${people.map(x=>`<option value="${esc(x.id)}" ${x.id===pid?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field"><span class="flabel">Pour quel(s) mois ?</span>${u.length?`<div class="pick">${u.map(m=>`<button type="button" data-act="sp-m" data-m="${m}" aria-pressed="${sel.has(m)}" class="${m<cm?'late':m===cm?'due':''}">${mLabel(m,1)}</button>`).join('')}</div>`:`<p class="note">${esc(p&&p.name)} est à jour.</p>`}</div>
      <div class="fields2">
        <div class="field"><label for="sp-a">Montant par mois (€)</label><input id="sp-a" inputmode="decimal" value="${fmtN(each())}"></div>
        <div class="field"><label for="sp-d">Reçu le</label><input id="sp-d" type="date" value="${date}"></div>
      </div>
      ${mixed()?`<p class="note" style="margin:-6px 0 12px">Chaque mois est compté au montant de sa cotisation.</p>`:''}
      <div class="field"><label for="sp-n">Note (facultatif)</label><input id="sp-n" value="${esc(note)}" placeholder="ex. virement groupé"></div>
      <div class="actions"><button class="btn block" data-act="sp-save" ${sel.size?'':'disabled'}>Enregistrer ${sel.size} mois · <span id="sp-t">${eur(total())}</span></button></div>`;
    },
    bind(root){
      const sp=root.querySelector('#sp-p');if(sp)sp.addEventListener('change',e=>{pid=e.target.value;sel=new Set();amount=null;const u=unpaidMonths(pid);if(u[0])sel.add(u[0]);drawSheet()});
      const a=root.querySelector('#sp-a');if(a)a.addEventListener('input',e=>{const v=num(e.target.value);amount=v==null?0:v;const t=root.querySelector('#sp-t');if(t)t.textContent=eur(amount*sel.size)});
      const d=root.querySelector('#sp-d');if(d)d.addEventListener('input',e=>{date=e.target.value||todayStr()});
      const n=root.querySelector('#sp-n');if(n)n.addEventListener('input',e=>{note=e.target.value});
    },
    act:{
      'sp-m':b=>{const m=b.dataset.m;if(sel.has(m))sel.delete(m);else sel.add(m);drawSheet()},
      'sp-save':async b=>{
        const p=S.people[pid],ms=[...sel].sort();
        if(amount!=null&&!(amount>0)){toast('Montant invalide');return}
        if(!ms.length)return;
        b.disabled=true;
        const ok=await w(()=>recordPayments(pid,ms,amount,date,note.trim()));
        if(ok){
          const tot=amount!=null?amount*ms.length:ms.reduce((s,m)=>s+rateM(m),0);
          toast(`${p.name} : ${ms.length} mois noté${ms.length>1?'s':''}`);
          sheetNotify({kind:'pay',pid,name:p.name,months:ms,total:tot});
        }else b.disabled=false;
      }
    }});
}
function sheetCell(pid,m){
  const p=S.people[pid];if(!p)return;
  if(!S.payments[payKey(pid,m)]){if(W())sheetPay({pid,months:[m]});else toast(`${p.name} · ${mLabel(m)} : pas encore payé`);return}
  let confirm=false;
  openSheet({live:true,
    render(){
      const pay=S.payments[payKey(pid,m)];
      if(!pay)return `<h3>${esc(p.name)} · ${mLabel(m)}</h3><p class="note">Ce versement n’existe plus.</p>`;
      return `<h3>${esc(p.name)} · ${mLabel(m)}</h3>
      <p class="lead"><span class="chip ok">Payé</span> ${eur(pay.amount)} reçus le ${fmtDate(pay.date)}${pay.note?` · ${esc(pay.note)}`:''}</p>
      ${W()?`<div class="fields2">
        <div class="field"><label for="sc-a">Montant (€)</label><input id="sc-a" inputmode="decimal" value="${fmtN(pay.amount)}"></div>
        <div class="field"><label for="sc-d">Reçu le</label><input id="sc-d" type="date" value="${esc(pay.date||'')}"></div>
      </div>
      <div class="field"><label for="sc-n">Note</label><input id="sc-n" value="${esc(pay.note||'')}"></div>
      <div class="actions"><button class="btn" data-act="sc-save">Corriger</button><button class="btn danger" data-act="sc-del">${confirm?'Confirmer l’annulation':'Annuler ce versement'}</button></div>`:''}`;
    },
    act:{
      'sc-save':async()=>{
        const a=num(sheetBody.querySelector('#sc-a').value);if(!(a>0)){toast('Montant invalide');return}
        const pay=S.payments[payKey(pid,m)];const sp=splitFor(p,m,a);
        const ok=await w(()=>S.db.doc('payments/'+payKey(pid,m)).update({amount:r2(a),ski:sp.ski,credit:sp.credit,date:sheetBody.querySelector('#sc-d').value||pay.date,note:sheetBody.querySelector('#sc-n').value.trim()}));
        if(ok){closeSheet();toast('Versement corrigé')}
      },
      'sc-del':async()=>{
        if(!confirm){confirm=true;drawSheet();return}
        const ok=await w(()=>S.db.doc('payments/'+payKey(pid,m)).delete());

      }

function sheetProject(pid){

  openSheet({
    render(){

      return `<h3>${isNew?'Nouveau projet':'Modifier le projet'}</h3><p class="lead">Chaque voyage a son budget. Une fois sa date passée, ce qui reste va au projet suivant.</p>

      </div>

/* ---------- prévenir le groupe ---------- */
function longDate(s){const [y,m,d]=s.split('-').map(Number);return `${d} ${MOIS[m-1]} ${y}`}
const plainRest=x=>x.rest.map(e=>String(e.label).toLowerCase()).join(', ');
/* Factures du voyage en cours : déjà payées (tout ce qui est sorti du livret) et qui restent. */
function billsFor(x){
  const paid=[],left=[];
  for(const e of x.exps){
    const pd=sumPay(e);
    if(pd>0)paid.push([e.label,pd]);
    if(e.rest||e.closed)continue;
    if(e.planned==null)left.push([e.label,null]);

function parseField(t){
  const k=t.dataset.kind,v=t.value;
  if(k==='bool')return t.checked;
  if(k==='text'){const s=v.trim();return s||undefined}
  if(k==='num'){const n=num(v);return n==null||n<0?undefined:r2(n)}
  if(k==='int'){const n=parseInt(v,10);return n>=1&&n<=28?n:undefined}
  if(k==='month')return /^\d{4}-\d{2}$/.test(v)?v:undefined;
  if(k==='month-opt')return v===''?null:(/^\d{4}-\d{2}$/.test(v)?v:undefined);
  return undefined;
}

const LS_KEY='la-cagnotte-donnees',META_KEY='la-cagnotte-meta';
const COLS=['people','payments','expenses','projects','extras','moves','settings'];
function deepMerge(a,b){const out=Object.assign({},a);for(const k of Object.keys(b)){const v=b[k];out[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))?deepMerge(a[k],v):v}return out}
function makeLocalDB(){
  const clone=o=>JSON.parse(JSON.stringify(o));
  const load=()=>{try{const d=JSON.parse(localStorage.getItem(LS_KEY)||'null');return d&&typeof d==='object'?d:{}}catch(e){return {}}};
  let data=load();const subs=new Set();
  const save=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(data))}catch(e){throw {code:'quota_exceeded',message:String(e)}}};
  const emit=()=>subs.forEach(f=>{try{f()}catch(e){console.error(e)}});
  const sub=f=>{subs.add(f);setTimeout(f,0);return ()=>subs.delete(f)};
  const parts=path=>{const p=String(path).split('/');if(p.length!==2||!p[0]||!p[1])throw new TypeError('Chemin invalide : '+path);return p};
  window.addEventListener('storage',e=>{if(e.key===LS_KEY){data=load();emit()}});
  return {
    doc(path){const [col,id]=parts(path);return {
      set:async v=>{(data[col]=data[col]||{})[id]=clone(v);save();emit()},
      update:async v=>{const cur=data[col]&&data[col][id];if(!cur)throw {code:'invalid_argument',message:'Document absent'};data[col][id]=deepMerge(cur,clone(v));save();emit()},
      delete:async()=>{if(data[col]&&data[col][id]){delete data[col][id];save();emit()}},
      onSnapshot:next=>sub(()=>{const d=data[col]&&data[col][id];next({id,exists:!!d,data:()=>d?clone(d):undefined})})
    }},
    collection(col){return {onSnapshot:next=>sub(()=>next({docs:Object.keys(data[col]||{}).map(id=>({id,exists:true,data:()=>clone(data[col][id])}))}))}},
    dump:()=>clone(data),
    replace:d=>{data=clone(d);save();emit()}
  };
}

    }
  }catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  return true;
}
async function exportBackup(){
  const payload={app:'la-cagnotte',version:1,exportedAt:new Date().toISOString(),data:S.db.dump()};
  const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
  const ok=await shareFile(blob,`cagnotte-sauvegarde-${todayStr()}.json`,'Sauvegarde La Cagnotte');
  if(ok){setMeta({lastBackup:new Date().toISOString()});render();toast('Sauvegarde prête')}
}
function pickImport(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.addEventListener('change',()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{
      let p;try{p=JSON.parse(fr.result)}catch(e){toast('Ce fichier n’est pas une sauvegarde valide');return}
      const d=p&&p.data;
      if(!d||typeof d!=='object'||!d.settings||!d.settings.main){toast('Ce fichier n’est pas une sauvegarde de La Cagnotte');return}
      sheetImport(d,p.exportedAt);
    };
    fr.readAsText(f);
  });
  inp.click();
}
function sheetImport(d,at){
  const n=k=>Object.keys(d[k]||{}).length,has=!!S.settings;
  openSheet({
    render(){return `<h3>Importer les données</h3>
      <p class="lead">Fichier${at?' du '+fmtDateTime(at).replace(/^le /,''):''} : ${n('people')} cotisants, ${n('payments')} versements, ${n('projects')} projets, ${n('expenses')} dépenses.</p>
      ${has?`<p class="warn" style="margin:0 0 12px">Les données actuelles de ce téléphone seront remplacées.</p>`:''}
      <div class="actions"><button class="btn block" data-act="im-ok">${has?'Remplacer et importer':'Importer'}</button></div>`},
    act:{'im-ok':()=>{
      const clean={};COLS.forEach(k=>{if(d[k]&&typeof d[k]==='object')clean[k]=d[k]});
      S.db.replace(clean);setMeta({lastBackup:at||null});closeSheet();toast('Données importées');
      if(location.hash&&location.hash!=='#accueil')location.hash='accueil';
    }}});
}

/* ---------- boot ---------- */
function boot(){
  if(/[?&]maj=/.test(location.search)){try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}setTimeout(()=>toast('Appli à jour : '+APP_VERSION),400)}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  S.db=makeLocalDB();S.canWrite=true;
  render();
  const done=k=>{S.ready[k]=true;if(allReady())S.status='ok';refresh()};
  const toMap=snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=Object.assign({id:d.id},d.data())});return o};
  const db=S.db;
  db.collection('people').onSnapshot(s=>{S.people=toMap(s);done('p')});
  db.collection('payments').onSnapshot(s=>{S.payments=toMap(s);done('pay')});
  db.collection('expenses').onSnapshot(s=>{S.expenses=toMap(s);done('e')});
  db.collection('projects').onSnapshot(s=>{S.projects=toMap(s);done('pr')});
  db.collection('extras').onSnapshot(s=>{S.extras=toMap(s);done('x')});
  db.collection('moves').onSnapshot(s=>{S.moves=toMap(s);done('m')});
  db.doc('settings/main').onSnapshot(d=>{S.settings=d.exists?Object.assign({},d.data()):null;done('s')});
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}

boot();
</script>
